<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="داقش — لعبة ورق خليجية أساسها المساومة والبلوف. العب مع أصحابك من أي جهاز.">
<meta name="theme-color" content="#0B1716">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="logo-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="داقش">
<meta property="og:type" content="website">
<meta property="og:site_name" content="داقش">
<meta property="og:title" content="داقش — ورق، مساومة، وبلوف">
<meta property="og:description" content="لعبة ورق خليجية أساسها المساومة والبلوف. العب مع أصحابك، كل واحد من جهازه.">
<meta property="og:url" content="https://waelsaballyl.github.io/dagesh/">
<meta property="og:image" content="https://waelsaballyl.github.io/dagesh/og.png">

<meta name="twitter:title" content="داقش — ورق، مساومة، وبلوف">
<meta name="twitter:description" content="لعبة ورق خليجية أساسها المساومة والبلوف. العب مع أصحابك، كل واحد من جهازه.">
<meta name="twitter:image" content="https://waelsaballyl.github.io/dagesh/og.png">
<title>داقش</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --paper:#0C0F11; --paper-2:#14181B; --paper-3:#1C2225;
  --ink:#EEF1EF; --ink-2:#A7AFB1; --ink-3:#6D7578;
  --rule:#232A2D; --rule-2:#333B3F;
  --accent:#E06A75; --accent-soft:#2B1618; --accent-line:#8C3A42;
  --gain:#4FC08C; --gain-soft:#122720;
  --warn:#D8A64E; --warn-soft:#26200F;
  --white:#F7F6F1;
  --felt:#101A18;
  --r:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);direction:rtl;
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Alexandria","IBM Plex Sans Arabic",sans-serif;font-weight:800;
  letter-spacing:-.02em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}

.app{max-width:660px;margin:0 auto;padding:0 16px 330px}

/* ---------- الترويسة ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:18px 0 14px;border-bottom:2px solid var(--ink)}
.bar h1{font-size:26px;line-height:1}
.bar .sub{font-size:10px;letter-spacing:.3em;color:var(--ink-3);padding-top:6px;margin-inline-end:auto}
.bar nav{display:flex;gap:6px}
.tbtn{background:none;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:var(--r);
  padding:7px 12px;font-size:12px;transition:.15s}
.tbtn:hover{border-color:var(--ink);color:var(--ink)}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- الشبكة ---------- */
.grid{display:flex;flex-direction:column}
.board{order:1;padding-top:16px}                 /* الطاولة فوق */
.rail{order:2;border-top:1px solid var(--rule);padding-top:18px;margin-top:28px}  /* السجل والاستنتاج تحت */

/* ---------- مرحلة الجولة ---------- */
.stage{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.step{flex:1;display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--paper-2);
  border-inline-start:1px solid var(--rule);transition:.2s}
.step:first-child{border-inline-start:0}
.step b{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:var(--paper-3);color:var(--ink-3);font-family:"Alexandria",sans-serif}
.step span{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.step.on{background:var(--ink)}
.step.on b{background:var(--paper);color:var(--ink)}
.step.on span{color:var(--paper);font-weight:600}
.step.done b{background:var(--gain-soft);color:var(--gain)}

/* ---------- دور مين ---------- */
#turnbar{display:flex;align-items:baseline;gap:10px;padding:14px 0;border-bottom:1px solid var(--rule);margin-bottom:4px}
#turnbar b{font-family:"Alexandria",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
#turnbar span{font-size:12.5px;color:var(--ink-2)}
#turnbar span::before{content:"·";margin-inline-end:9px;color:var(--rule-2)}
#turnbar.mine b{color:var(--accent)}
#turnbar.mine::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
  margin-inline-start:auto;align-self:center;animation:blip 1.2s infinite}
@keyframes blip{50%{opacity:.2}}
#turnbar.dagesh b{color:var(--accent)}
#turnbar.quiet b{color:var(--ink-3)}

/* ---------- الطاولة الدائرية ---------- */
.ring{position:relative;width:100%;max-width:560px;margin:22px auto 10px;aspect-ratio:1/1.05}
.felt{position:absolute;inset:15% 12%;border-radius:50%;
  background:radial-gradient(70% 70% at 50% 40%,#16211F 0%,var(--felt) 70%);
  border:1px solid var(--rule);box-shadow:inset 0 0 60px rgba(0,0,0,.55)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:2}
.core .lbl{font-size:9.5px;letter-spacing:.24em;color:var(--ink-3)}
.core .val{font-family:"Alexandria",sans-serif;font-weight:800;font-size:32px;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.core .ph{font-size:10.5px;color:var(--ink-3);max-width:170px;line-height:1.4}
.core.bump .val{animation:pop .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{45%{transform:scale(1.1)}}

.seats{position:absolute;inset:0}
.seat{position:absolute;transform:translate(-50%,-50%);width:96px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;
  padding:7px 5px 6px;transition:.22s;z-index:3}
.ring.tight .seat{width:84px;padding:6px 4px}
.seat.turn{border-color:var(--warn);background:var(--warn-soft);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.seat.dim{opacity:.4}
.seat.mine{border-color:var(--accent-line);background:var(--accent-soft)}
.seat .nm{font-family:"Alexandria",sans-serif;font-weight:600;font-size:12px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .chipbal{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.seat .betchip{font-family:"Alexandria",sans-serif;font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums;color:var(--ink-3);line-height:1.1}
.seat .betchip.on{color:var(--warn)}
.ring.tight .seat .betchip{font-size:13px}
.badge{font-size:8.5px;padding:1.5px 6px;border-radius:3px;white-space:nowrap;font-weight:600}
.b-mic{background:var(--accent);color:#1A0C0E}
.b-turn{background:var(--warn);color:#191400}
.b-in{background:var(--gain-soft);color:var(--gain)}
.b-out{background:var(--paper-3);color:var(--ink-3)}
.b-wait{border:1px dashed var(--rule-2);color:var(--ink-3)}
.seat .mini{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap;
  height:24px;align-items:center}
.seat .mini .card.sm{width:17px;height:24px;border-radius:2px;box-shadow:none}
.seat .mini .card.sm .face-svg .idx.big{font-size:78px}
.ring.tight .seat .mini .card.sm{width:14px;height:20px}
.seat .backs{display:flex;gap:2px}
.seat .backs i{width:9px;height:13px;border-radius:2px;background:var(--accent-line);
  border:1px solid rgba(0,0,0,.4);display:block}
.seat .note{font-size:9px;color:var(--ink-3);text-align:center;line-height:1.3;min-height:11px;
  max-width:100%;overflow:hidden}
.you-tag{display:none}

.fly{position:absolute;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  font-family:"Alexandria",sans-serif;font-weight:800;font-size:13px;padding:5px 11px;border-radius:99px;
  transition:left .6s cubic-bezier(.3,.8,.3,1),top .6s cubic-bezier(.3,.8,.3,1),
             opacity .6s ease,transform .6s ease}
.fly.chip{background:var(--warn);color:#191400;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.fly.out{background:var(--paper-3);color:var(--ink-3);font-size:11px}

@media(max-width:520px){
  .ring{max-width:none;aspect-ratio:1/1.22;margin-top:14px}
  .seat{width:80px;padding:6px 4px;gap:2px}
  .seat .nm{font-size:11px}
  .seat .betchip{font-size:14px}
  .ring.tight .seat{width:68px;padding:5px 3px}
  .core .val{font-size:25px}
  .core .ph{max-width:130px;font-size:9.5px}
}

/* ---------- الأوراق ---------- */
.card{width:62px;height:88px;border-radius:5px;background:var(--white);flex:none;overflow:hidden;
  position:relative;border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.face-svg{width:100%;height:100%;display:block;color:#16242C}
.face-svg.red{color:#A8232E}
.face-svg path,.face-svg circle,.face-svg rect{fill:currentColor}
.face-svg .face{fill:#EFD8BE;stroke:currentColor;stroke-width:1.3}
.face-svg .robe{fill:currentColor;opacity:.8}
.face-svg .panel{fill:none;stroke:currentColor;stroke-width:1.1;opacity:.38}
.face-svg .ink-s{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.face-svg .idx{font:800 24px "Alexandria",sans-serif;text-anchor:middle;dominant-baseline:central}
.face-svg .idx.big{font-size:54px}
.card.sm{width:30px;height:43px;border-radius:3px}
.card.sm .mini-idx{display:none}
.card.back{background:var(--accent);border-color:rgba(0,0,0,.3)}
.card.back::after{content:"";position:absolute;inset:4px;border-radius:2px;
  background:repeating-linear-gradient(-45deg,transparent 0 4px,rgba(255,255,255,.16) 4px 8px);
  outline:1px solid rgba(255,255,255,.3)}
.cardimg{position:absolute;inset:0;width:100%;height:100%;display:block;background:#fff}
.deal{animation:deal .4s cubic-bezier(.2,.85,.3,1) backwards}
@keyframes deal{from{transform:translateY(-18px);opacity:0}}

/* ---------- ورقك ---------- */
.mine-sec{padding:18px 0 0}
.mine-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mine-head h2{font-size:15px}
.mine-head .sp{flex:1}
.stat{font-size:10px;letter-spacing:.18em;color:var(--ink-3)}
.stat b{display:block;font-family:"Alexandria",sans-serif;font-weight:800;font-size:19px;
  color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hand{display:flex;gap:9px;justify-content:center}
.hand .card{width:84px;height:122px;border-radius:7px}
.project{text-align:center;margin-top:14px;font-family:"Alexandria",sans-serif;font-weight:800;
  font-size:21px;color:var(--accent);letter-spacing:-.02em}

/* ---------- شريط الأفعال ---------- */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:12;background:var(--paper);
  border-top:2px solid var(--ink);box-shadow:0 -6px 24px rgba(0,0,0,.10)}
.dock-in{max-width:660px;margin:0 auto;padding:13px 16px calc(13px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:11px}
.prompt{font-size:13.5px;color:var(--ink-2)}
.prompt b{color:var(--ink);font-weight:600}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.act{font-size:14.5px;font-weight:600;border-radius:var(--r);padding:13px 18px;
  border:1px solid transparent;flex:1;min-width:112px;transition:.15s}
button.act:hover{filter:brightness(1.07)}
button.act:active{transform:translateY(1px)}
button.act[disabled]{opacity:.35;cursor:not-allowed}
.b-brass{background:var(--ink);color:var(--paper)}
.b-pom{background:var(--accent);color:var(--white)}
.b-quiet{background:transparent;border-color:var(--rule-2);color:var(--ink-2)}
.b-quiet:hover{border-color:var(--ink);color:var(--ink)}
.amt{display:flex;align-items:center;gap:11px;width:100%}

.amt output{font-variant-numeric:tabular-nums;font-family:"Alexandria",sans-serif;font-weight:800;
  min-width:104px;text-align:center;background:var(--paper-2);border:1px solid var(--rule);
  border-radius:var(--r);padding:9px 8px;font-size:17px}
.always-dagesh{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed var(--rule-2)}
.always-dagesh button{flex:0 0 auto;min-width:auto;padding:9px 16px;font-size:13px}
.always-dagesh span{font-size:11px;color:var(--ink-3)}

/* ---------- محرّر التقسيم ---------- */
.split{display:flex;flex-direction:column;gap:7px;width:100%}
.sp-row{display:flex;align-items:center;gap:9px;font-size:13px}
.sp-row .nm{flex:1;font-family:"Alexandria",sans-serif;font-weight:600}
.sp-row .val{font-variant-numeric:tabular-nums;min-width:88px;text-align:center;font-weight:700;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);padding:7px}
.stp{width:36px;height:36px;border-radius:var(--r);border:1px solid var(--rule-2);
  background:transparent;color:var(--ink);font-size:18px;flex:none}
.stp:active{background:var(--paper-2)}
.left{font-size:11.5px;color:var(--ink-3);text-align:center}
.left.bad{color:var(--accent)}

/* ---------- الشريط الجانبي ---------- */
.rail section+section{margin-top:22px}
.rail h3{font-size:10px;letter-spacing:.26em;color:var(--ink-3);margin-bottom:10px;
  font-family:"IBM Plex Sans Arabic";font-weight:600}
.logbox{display:flex;flex-direction:column;font-size:12px;max-height:340px;overflow-y:auto}
.logbox p{margin:0;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--rule);line-height:1.5}
.logbox p:last-child{border-bottom:0}
.logbox p.hi{color:var(--ink);font-weight:600}
.logbox p.dg{color:var(--accent);font-weight:600}
.rows{display:flex;flex-direction:column;font-size:12.5px}
.row{display:flex;justify-content:space-between;gap:10px;color:var(--ink-3);padding:6px 0;
  border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10px;border:1px solid var(--rule);color:var(--ink-3);border-radius:3px;padding:2px 6px}

/* ---------- شاشة تمرير الجوال ---------- */
.gate{position:fixed;inset:0;z-index:15;background:var(--paper);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;padding:26px;text-align:center}
.gate[hidden]{display:none}
.gate h2{font-size:36px}
.gate p{color:var(--ink-2);max-width:320px;margin:0;font-size:14px}

/* ---------- النوافذ ---------- */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:26px;
  max-width:520px;width:100%;max-height:88vh;overflow-y:auto;animation:rise .28s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.sheet h2{font-size:28px;margin-bottom:8px}
.sheet p,.sheet li{color:var(--ink-2);font-size:13.5px}
.sheet ol{padding-inline-start:18px}.sheet li{margin-bottom:6px}
.rev{display:flex;flex-direction:column;margin:16px 0;border-top:1px solid var(--rule)}
.rev-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--rule)}
.rev-row .w{font-family:"Alexandria",sans-serif;font-weight:600;font-size:13.5px;min-width:62px}
.rev-row .p{font-size:11.5px;color:var(--ink-3);margin-inline-start:auto;text-align:end}
.rev-row.win .p{color:var(--gain);font-weight:700}

/* ---------- الإعدادات ---------- */
.opt{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.opt label,.field label{font-size:10px;letter-spacing:.24em;color:var(--ink-3)}
.segs{display:flex;gap:5px;flex-wrap:wrap}
.segs button{font-size:13.5px;padding:9px 13px;border-radius:var(--r);background:transparent;
  border:1px solid var(--rule-2);color:var(--ink-2);transition:.15s;min-width:46px;flex:1}
.segs button:hover{border-color:var(--ink)}
.segs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field input{font:inherit;font-size:16px;padding:12px 13px;border-radius:var(--r);background:var(--paper-2);
  border:1px solid var(--rule-2);color:var(--ink);width:100%}
.field input:focus{border-color:var(--ink)}
.field input.bad{border-color:var(--accent);background:var(--accent-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.field .err{font-size:11px;color:var(--accent)}
.field input.code{text-align:center;letter-spacing:.55em;text-indent:.55em;direction:ltr;
  font-family:"Alexandria",sans-serif;font-weight:800;font-size:30px}
.roomcode{font-family:"Alexandria",sans-serif;font-weight:800;font-size:56px;letter-spacing:.2em;
  text-indent:.2em;text-align:center;padding:16px 8px;margin:14px 0;direction:ltr;
  border-block:2px solid var(--ink)}
.lobby-list{display:flex;flex-direction:column;margin:14px 0;border-top:1px solid var(--rule)}
.lobby-p{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.lobby-p .dot{width:7px;height:7px;border-radius:50%;background:var(--gain);flex:none}
.lobby-p .me{margin-inline-start:auto;font-size:10.5px;color:var(--accent)}
.warn{font-size:12px;color:var(--ink-2);border-inline-start:2px solid var(--rule-2);
  padding-inline-start:11px;margin-top:12px;line-height:1.65}
.conn{font-size:12px;color:var(--ink-3);text-align:center}
.conn.bad{color:var(--accent)}


/* ===== أفاتار اللاعب ===== */
.ava{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-family:"Alexandria",sans-serif;font-weight:800;font-size:14px;position:relative;
  background:hsl(var(--h) 30% 19%);color:hsl(var(--h) 62% 74%);border:1px solid hsl(var(--h) 26% 31%)}
.ava .dlr{position:absolute;inset-block-end:-4px;inset-inline-end:-5px;width:16px;height:16px;
  border-radius:50%;background:var(--warn);color:#191400;font-size:9px;font-weight:800;
  display:grid;place-items:center;border:2px solid var(--paper)}

/* ===== شاشة البداية ===== */
.hero{margin-bottom:22px}
.brandmark{display:block;border-radius:20px;margin-bottom:14px;
  box-shadow:0 8px 26px rgba(0,0,0,.55)}
.brandmini{border-radius:7px;flex:none}
.hero h2{font-size:40px;line-height:1;margin-bottom:10px;letter-spacing:-.04em}
.hero.sm h2{font-size:30px}
.hero p{color:var(--ink-2);font-size:14px;margin:0;max-width:38ch}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:22px}
.modes button{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:start;
  padding:12px 11px;border-radius:var(--r);background:transparent;border:1px solid var(--rule-2);
  color:var(--ink-2);transition:.15s}
.modes button b{font-family:"Alexandria",sans-serif;font-weight:600;font-size:13.5px;color:var(--ink)}
.modes button span{font-size:10.5px;color:var(--ink-3);line-height:1.3}
.modes button:hover{border-color:var(--ink-3)}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.modes button[aria-pressed="true"] b,.modes button[aria-pressed="true"] span{color:var(--paper)}

.panel-card{border:1px solid var(--rule);border-radius:12px;padding:15px;margin-bottom:4px}
.pc-head{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}
.pc-head b{font-family:"Alexandria",sans-serif;font-weight:800;font-size:16px}
.pc-head span{font-size:11.5px;color:var(--ink-3)}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--ink-3);font-size:11.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}
.field.big input{font-size:18px;padding:14px}
.segs.tight button{min-width:38px;flex:0 0 auto;padding:8px 11px;font-size:13px}
button.act.wide{width:100%;flex:none;margin-top:4px}
.setup-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.setup-foot span{font-size:11.5px;color:var(--ink-3)}
.linky{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;
  text-decoration:underline;text-underline-offset:3px;padding:0}
#fCode{margin-bottom:12px}

/* ===== شاشة القواعد ===== */
.rule-sec{margin-bottom:22px}
.rule-sec h3{font-family:"Alexandria",sans-serif;font-weight:800;font-size:15px;margin-bottom:8px;
  padding-bottom:6px;border-bottom:1px solid var(--rule)}
.rule-sec p{margin:0 0 8px;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.rule-sec p b,.rule-goal b{color:var(--ink);font-weight:600}
ol.proj{list-style:none;padding:0;margin:0;counter-reset:pj}
ol.proj li{counter-increment:pj;display:flex;align-items:baseline;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
ol.proj li:last-child{border-bottom:0}
ol.proj li::before{content:counter(pj);width:20px;height:20px;flex:none;border-radius:50%;
  background:var(--paper-3);color:var(--ink-3);display:grid;place-items:center;
  font-size:10.5px;font-family:"Alexandria",sans-serif;align-self:center}
ol.proj li b{font-family:"Alexandria",sans-serif;font-weight:700;color:var(--ink);min-width:88px}
ol.proj li span{color:var(--ink-3);font-size:12.5px}
.stepbox{display:flex;flex-direction:column;gap:12px}
.sb{border-inline-start:3px solid var(--accent);padding-inline-start:13px}
.sb b{font-family:"Alexandria",sans-serif;font-weight:800;font-size:14px;display:block;margin-bottom:5px}
.sb p{margin:0 0 6px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.sb p.tip{font-size:12px;color:var(--ink-3);font-style:italic}
.rule-goal{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;
  padding:13px 15px;font-size:13.5px;line-height:1.7;color:var(--ink);margin-bottom:16px}
.credit{font-size:10.5px;color:var(--ink-3);border-top:1px solid var(--rule);
  padding-top:10px;margin:0 0 14px}

/* كومة الورق في نص الطاولة */
.pile{position:relative;height:34px;width:52px;margin:3px 0 1px}
.pile i{position:absolute;left:50%;top:0;width:24px;height:33px;border-radius:3px;display:block;
  background:linear-gradient(150deg,#8E3230,#4E1B1C);border:1px solid rgba(0,0,0,.5);
  transform:translateX(calc(-50% + var(--dx,0px))) rotate(var(--rot,0deg));
  box-shadow:0 2px 6px rgba(0,0,0,.55);animation:drop .34s cubic-bezier(.25,1.2,.4,1) backwards}
@keyframes drop{from{transform:translate(calc(-50% + var(--dx,0px)),-26px) rotate(0deg) scale(1.25);opacity:0}}

/* ورقك ثابت مع شريط الأفعال */
.myrow{display:flex;align-items:center;gap:12px;padding-bottom:11px;border-bottom:1px solid var(--rule)}
.myrow .hand{gap:6px;justify-content:flex-start;flex:1;min-width:0}
.myrow .hand .card{width:52px;height:74px;border-radius:5px}
.mymeta{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.mymeta .project{margin:0;font-size:14px;line-height:1.2}
.mymeta .stat{font-size:10px;letter-spacing:.1em}
.mymeta .stat b{display:inline;font-size:13px;margin-inline-start:3px}
#youName{display:none}

/* شاشة الكشف */
.win-banner{background:var(--gain-soft);border:1px solid var(--gain);border-radius:10px;
  padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:2px}
.win-banner b{font-family:"Alexandria",sans-serif;font-weight:800;font-size:19px;color:var(--gain)}
.win-banner span{font-size:12.5px;color:var(--ink-2)}
.win-banner.tie{background:var(--warn-soft);border-color:var(--warn)}
.win-banner.tie b{color:var(--warn)}
.rev-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--rule)}
.rev-row .rc{display:flex;gap:2px}
.rev-row.lose{opacity:.62}
.rev-row .amt-col{font-family:"Alexandria",sans-serif;font-weight:800;font-size:14px;
  font-variant-numeric:tabular-nums;min-width:64px;text-align:end}
.rev-row.win .amt-col{color:var(--gain)}
.rev-row.lose .amt-col{color:var(--accent)}

/* غرفة: إنشاء يمين ودخول يسار */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.duo .panel-card{margin-bottom:0;display:flex;flex-direction:column}
.pc-sub{font-size:11.5px;color:var(--ink-3);margin:0 0 12px;line-height:1.5}
.panel-card.join{justify-content:space-between}
.field input.code,#fCode{text-align:center;letter-spacing:.26em;text-indent:.26em;direction:ltr;
  font-family:"Alexandria",sans-serif;font-weight:800;font-size:26px;padding:16px 6px;
  background:var(--paper-3);border:2px solid var(--rule-2);border-radius:10px;width:100%;
  color:var(--ink);margin-bottom:12px}
#fCode:focus{border-color:var(--warn);outline:none}
#fCode::placeholder{color:var(--rule-2)}
@media(max-width:520px){ .duo{grid-template-columns:1fr} }

/* ===== أزرار المراهنة بدل السلايدر ===== */
/* سلايدر المراهنة — مساحة لمس كبيرة، والسحب ما يتلخبط مع تمرير الصفحة */
.amt{display:flex;align-items:center;gap:12px;width:100%}
.amtval{flex:none;min-width:112px;text-align:center;font-family:"Alexandria",sans-serif;
  font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;background:var(--paper-3);
  border:1px solid var(--rule-2);border-radius:12px;padding:11px 8px;line-height:1.1}
.amt input[type=range],input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;
  height:48px;background:transparent;margin:0;padding:0;cursor:pointer;
  touch-action:none;                 /* ← بدونها الجوال يعتبر السحب تمرير للصفحة */
  direction:ltr}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;
  background:linear-gradient(90deg,var(--warn) 0%,var(--warn) var(--fill,0%),
             var(--paper-3) var(--fill,0%),var(--paper-3) 100%);
  border:1px solid var(--rule-2)}
input[type=range]::-moz-range-track{height:12px;border-radius:99px;background:var(--paper-3);
  border:1px solid var(--rule-2)}
input[type=range]::-moz-range-progress{height:12px;border-radius:99px;background:var(--warn)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:38px;height:38px;margin-top:-14px;border-radius:50%;background:var(--warn);
  border:3px solid var(--paper);box-shadow:0 3px 12px rgba(0,0,0,.6)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--warn);
  border:3px solid var(--paper);box-shadow:0 3px 12px rgba(0,0,0,.6)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}

/* ===== شكل اللاب ===== */
.app[data-view="lap"]{max-width:1160px;padding-bottom:300px}
.app[data-view="lap"] .grid{display:grid;grid-template-columns:290px minmax(0,1fr);
  gap:30px;align-items:start}
.app[data-view="lap"] .board{padding-top:18px}
.app[data-view="lap"] .rail{border-top:0;border-inline-start:1px solid var(--rule);
  padding-top:18px;margin-top:0;padding-inline-start:24px;position:sticky;top:14px;
  max-height:calc(100vh - 40px);overflow-y:auto}
.app[data-view="lap"] .ring{max-width:640px;aspect-ratio:1/0.86}
.app[data-view="lap"] .seat{width:118px}
.app[data-view="lap"] .ring.tight .seat{width:96px}
.app[data-view="lap"] .core .val{font-size:40px}
.app[data-view="lap"] .core .ph{max-width:220px;font-size:11.5px}
.app[data-view="lap"] .dock-in{max-width:1160px}
.app[data-view="lap"] .myrow .hand .card{width:66px;height:94px}
.app[data-view="lap"] .logbox{max-height:none}
.app[data-view="lap"] .amtval{font-size:30px}
.app[data-view="lap"] .quick{grid-template-columns:repeat(4,minmax(0,150px));justify-content:flex-start}
@media(max-width:900px){ .app[data-view="lap"] .grid{grid-template-columns:1fr}
  .app[data-view="lap"] .rail{border-inline-start:0;border-top:1px solid var(--rule);
    padding-inline-start:0;margin-top:24px;position:static;max-height:none} }


/* ===== الدردشة والحاضرون ===== */
.chatbox{display:flex;flex-direction:column-reverse;gap:5px;max-height:170px;overflow-y:auto;
  font-size:12.5px;margin-bottom:8px}
.chatbox p{margin:0;color:var(--ink-2);line-height:1.5;word-break:break-word}
.chatbox p b{color:var(--warn);font-weight:600;margin-inline-end:5px}
.chatrow{display:flex;gap:6px}
.chatrow input{flex:1;min-width:0;font:inherit;font-size:14px;padding:9px 11px;border-radius:9px;
  background:var(--paper-2);border:1px solid var(--rule-2);color:var(--ink)}
.chatrow input:focus{border-color:var(--warn);outline:none}
.chatrow .act{flex:0 0 auto;min-width:auto;padding:9px 14px;font-size:13px}
.lobby-p.off{opacity:.45}
.lobby-p.spec .dot,.dot.sp{background:var(--ink-3);box-shadow:none}
.off-tag{font-size:10px;color:var(--ink-3);margin-inline-start:auto}
.spec-head{font-size:10px;letter-spacing:.2em;color:var(--ink-3);padding:10px 0 4px;
  border-top:1px solid var(--rule);margin-top:6px}
.kick{margin-inline-start:auto;width:24px;height:24px;border-radius:6px;border:1px solid var(--rule-2);
  background:transparent;color:var(--ink-3);font-size:15px;line-height:1;flex:none}
.kick:hover{border-color:var(--accent);color:var(--accent)}
.off-tag + .kick{margin-inline-start:6px}
.spec-note{background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.spec-note b{color:var(--warn)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="bar">
    <img class="brandmini" src="favicon-64.png" alt="" width="26" height="26">
    <h1>داقش</h1>
    <span class="sub">لعبة مساومة</span>
    <nav>
      <button class="tbtn" id="bMute" title="الصوت">🔊</button>
      <button class="tbtn" id="bView" title="بدّل بين شكل الجوال وشكل اللاب">جوال</button>
      <button class="tbtn" id="bRules">القواعد</button>
      <button class="tbtn" id="bNew">جلسة جديدة</button>
    </nav>
  </header>

  <div class="grid">
    <aside class="rail">
      <section id="chatSec" hidden>
        <h3>الدردشة</h3>
        <div class="chatbox" id="chatBox"></div>
        <div class="chatrow">
          <input id="chatIn" maxlength="160" placeholder="اكتب رسالة…" autocomplete="off">
          <button class="act b-brass" id="chatSend">إرسال</button>
        </div>
      </section>
      <section id="rosterSec" hidden>
        <h3>الحاضرون</h3>
        <div class="lobby-list" id="rosterBox"></div>
      </section>
      <section>
        <h3>سجل الجولة</h3>
        <div class="logbox" id="log"></div>
      </section>
    </aside>

    <main class="board">
      <div class="stage" id="stepper">
        <div class="step" data-s="1"><b>١</b><span>الأكشن — مراهنة أو انسحاب</span></div>
        <div class="step" data-s="2"><b>٢</b><span>المناقشة — المايك يعرض التقسيم</span></div>
      </div>
      <div class="turn" id="turnbar"></div>

      <div class="ring" id="ring">
        <div class="felt"></div>
        <div class="core" id="tray">
          <span class="lbl" id="potLabel">القدر</span>
          <span class="val num" id="pot">0</span>
          <div class="pile" id="pile"></div>
          <span class="ph" id="phase"></span>

    </main>
  </div>

  <div class="dock">
    <div class="dock-in">
      <div class="myrow">
        <div class="hand" id="hand"></div>
        <div class="mymeta">
          <span class="project" id="proj"></span>
          <span class="stat" id="youName">ورقك</span>
          <span class="stat">الرصيد <b class="num" id="myChips">0</b></span>
        </div>
      </div>
      <div id="actions"></div>
    </div>
  </div>
</div>

<div class="gate" id="gate" hidden>
  <h2 id="gateName"></h2>
  <p id="gateHint">مرّر الجوال له، ولا تخلّي أحد يشوف الشاشة.</p>
  <button class="act b-brass" style="max-width:240px" id="gateBtn">أنا هو — وريني ورقي</button>
</div>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
"use strict";
/* ================= داقش — المحرّك =================
   الشدّة مقفولة: لكل لاعب مرتبة وحدة بأشكالها الأربعة. */
const RANKS=["A","K","Q","J","10","9","8","7","6","5","4","3","2"];  // 13 مرتبة = 52 ورقة
const AR={A:"أكة",K:"شايب",Q:"بنت",J:"ولد","10":"عشرة","9":"تسعة","8":"ثمانية",
          "7":"سبعة","6":"ستة","5":"خمسة","4":"أربعة","3":"ثلاثة","2":"اثنين"};
const SUITS=["♠","♥","♦","♣"], RED=new Set(["♥","♦"]);
const START=100000, STEP=5000;
const PROJ={6:"رباعية",5:"مية",4:"ثلاثية",3:"دبل ثنائية",2:"ثنائية",1:"ورق عادي"};
const BOTNAMES=["فيصل","نورة","سعد","منى","خالد","عبدالملك","ريم","تركي","لطيفة","بدر","هيا","ماجد"];

let S=null, ranks=[], rv={}, ri={};

function buildRanks(n){ranks=RANKS.slice(0,n);rv={};ri={};ranks.forEach((r,i)=>{ri[r]=i;rv[r]=ranks.length-i;});}
/* عشوائية تشفيرية + رفض التحيّز: كل ترتيب احتماله متساوي تماماً */
function rnd(n){
  if(window.crypto&&crypto.getRandomValues){
    const lim=Math.floor(4294967296/n)*n, a=new Uint32Array(1);
    let v; do{crypto.getRandomValues(a);v=a[0];}while(v>=lim);
    return v%n;
  }
  return (Math.random()*n)|0;
}
function deck(){
  const d=[];for(const r of ranks)for(const s of SUITS)d.push({r,s});
  for(let k=0;k<3;k++)                       // ثلاث خلطات كاملة
    for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]];}
  return d;
}

/* ---- تقييم المشروع ---- */
function ev(cards){
  const byR={},byS={};
  for(const c of cards){(byR[c.r]=byR[c.r]||0);byR[c.r]++;byS[c.s]=(byS[c.s]||0)+1;}
  const g=Object.keys(byR).map(r=>({r,n:byR[r],v:rv[r]})).sort((a,b)=>b.n-a.n||b.v-a.v);
  if(g[0].n===4)return{cat:6,tb:[g[0].v]};
  if(g.length===4){
    const same=Object.keys(byS).length===1;
    const ix=g.map(x=>ri[x.r]).sort((a,b)=>a-b);
    let run=true;for(let i=1;i<ix.length;i++)if(ix[i]!==ix[i-1]+1)run=false;
    if(same&&run)return{cat:5,tb:[Math.max(...g.map(x=>x.v))]};
  }
  if(g[0].n===3)return{cat:4,tb:[g[0].v,g[1].v]};
  if(g[0].n===2&&g[1]&&g[1].n===2)return{cat:3,tb:[Math.max(g[0].v,g[1].v),Math.min(g[0].v,g[1].v)]};
  if(g[0].n===2)return{cat:2,tb:[g[0].v,...g.slice(1).map(x=>x.v).sort((a,b)=>b-a)]};
  return{cat:1,tb:g.map(x=>x.v).sort((a,b)=>b-a)};
}
function cmp(a,b){if(a.cat!==b.cat)return a.cat-b.cat;
  for(let i=0;i<4;i++){const x=a.tb[i]||0,y=b.tb[i]||0;if(x!==y)return x-y;}return 0;}
const rname=v=>Object.keys(rv).find(r=>rv[r]===v);
function pdetail(e){switch(e.cat){
  case 6:return`رباعية ${AR[rname(e.tb[0])]}`; case 5:return`مية من ${AR[rname(e.tb[0])]}`;
  case 4:return`ثلاثية ${AR[rname(e.tb[0])]}`; case 3:return`${AR[rname(e.tb[0])]} و${AR[rname(e.tb[1])]}`;
  case 2:return`ثنائية ${AR[rname(e.tb[0])]}`; default:return`أعلى ورقة ${AR[rname(e.tb[0])]}`;}}

/* ---- الاحتمالات: الشدّة مقفولة فنعدّ كل التركيبات ---- */
function unknownFor(hand){const m=new Set(hand.map(c=>c.r+c.s));const u=[];
  for(const r of ranks)for(const s of SUITS)if(!m.has(r+s))u.push({r,s});return u;}
function probs(p){
  const key=p.hand.map(c=>c.r+c.s).join();
  if(p._k===key)return p._p;
  const u=unknownFor(p.hand),me=p.eval;let t=0,b=0,q=0;
  if(u.length<=20){                       // شدّة صغيرة: نعدّ كل الاحتمالات بالضبط
    for(let a=0;a<u.length-3;a++)for(let c=a+1;c<u.length-2;c++)for(let d=c+1;d<u.length-1;d++)for(let f=d+1;f<u.length;f++){
      t++;const r=cmp(ev([u[a],u[c],u[d],u[f]]),me);if(r>0)b++;else if(r===0)q++;}
  }else{                                  // شدّة كبيرة: عيّنة عشوائية، دقتها كافية وسريعة
    const N=5000, pick=new Array(4);
    for(let i=0;i<N;i++){
      for(let j=0;j<4;j++){
        let x; do{ x=u[(Math.random()*u.length)|0]; }while(pick.indexOf(x)>=0&&j>0);
        pick[j]=x;
      }
      t++;const r=cmp(ev(pick),me);if(r>0)b++;else if(r===0)q++;
    }
  }
  p._k=key;p._p={single:1-b/t-q/t,tie:q/t};return p._p;
}
function strength(p,opp){const s=probs(p).single;return{single:s,win:Math.pow(s,Math.max(1,opp))};}

/* ---- الجلسة ---- */
const GOAL=1000000;          // هدف الفوز ثابت
function newSession(n,mode,diff,names){
  buildRanks(n);
  S={n,mode,diff,dealer:(Math.random()*n)|0,pot:0,boss:-1,phase:"",turn:0,order:[],
     goal:GOAL,
     log:[],revealed:new Set(),handNo:0,epoch:0,revisions:0,gate:false,viewer:0,busy:false,
     players:Array.from({length:n},(_,i)=>({
       i,name:names[i],bot:mode==="bots"&&i!==0,chips:START,hand:[],eval:null,
       bet:0,folded:false,out:false,acted:false,note:"",resp:null,share:0,askOut:false}))};
  startHand();
}
/* مؤقّت مربوط بالجولة: لو بدأت جولة جديدة، المهام القديمة تُلغى بدل ما تعبث بالحالة */
function later(fn,ms){
  const ep=S.epoch;
  return setTimeout(()=>{ if(S&&S.epoch===ep) fn(); },ms);
}
const alive=()=>S.players.filter(p=>!p.out);
/* 4 إلى 6 لاعبين ← تنتهي على اثنين. 7 فأكثر ← تنتهي على ثلاثة. */
const endAt=()=>S.n>=7?3:2;
const goal=()=>S.goal||1000000;       // أول لاعب يوصله يفوز
const live=()=>S.players.filter(p=>!p.out&&!p.folded);
const bettors=()=>S.players.filter(p=>!p.out&&!p.folded&&p.bet>0);
const others=()=>bettors().filter(p=>p.i!==S.boss);
const split=()=>S.boss>=0?S.players[S.boss].bet:0;   // المبلغ اللي ينقسم = مراهنة المايك
function say(t,c){S.log.unshift({t,c});if(S.log.length>50)S.log.pop();}

function startHand(){
  const champ0=alive().find(p=>p.chips>=goal());        // فحص الفوز هنا كمان،
  if(champ0)return endSession(champ0);                  // عشان ما يضيع لو ضغط "الجولة الجاية" بسرعة
  if(alive().length<=endAt())return endSession();
  S.pot=0;
  S.epoch=(S.epoch||0)+1;
  S.handNo++;
  pileClear();S.boss=-1;S.revealed=new Set();S.log=[];S.revisions=0;window._sp=null;
  const d=deck();
  for(const p of S.players){
    p.bet=0;p.folded=p.out;p.acted=false;p.note="";p.resp=null;p.share=0;p.askOut=false;p._k=null;p.hand=[];
    if(!p.out){p.hand=d.splice(0,4);p.eval=ev(p.hand);}
  }
  do{S.dealer=(S.dealer+1)%S.n;}while(S.players[S.dealer].out);
  say(`الجولة ${S.handNo} — ${S.players[S.dealer].name} لخبط الورق`,"hi");
  S.order=[];let k=S.dealer;
  for(let c=0;c<S.n;c++){k=(k+1)%S.n;if(!S.players[k].out)S.order.push(k);}
  S.turn=0;S.phase="betting";
  if(S.order.length)say(`يبدأ ${S.players[S.order[0]].name} — أول واحد بعد الموزّع`);
  sfx("deal");
  advance();
}
const highBet=()=>Math.max(0,...S.players.map(p=>p.bet));

/* ---- المراهنة ---- */
function advance(){
  if(S.phase!=="betting")return;
  if(S.turn>=S.order.length)return endBetting();
  const p=S.players[S.order[S.turn]];
  if(p.folded){S.turn++;return advance();}
  setViewer(p.i);
  if(p.bot){render();S.busy=true;later(()=>{botBet(p);S.busy=false;S.turn++;advance();},800);}
  else{S.gate=(S.mode==="pass");render();}
}
/* المراهنة رقم معلن فقط — ما ينقص من المحفظة شي إلا عند التسوية آخر الجولة */
function bet(p,amt){
  if(S.phase!=="betting"||p.folded||p.out)return;
  amt=Math.min(amt,p.chips);
  p.bet=amt;p.acted=true;
  const allin=amt>=p.chips;
  p.note=allin?`أول-إن ${fmt(amt)}`:`راهن ${fmt(amt)}`;
  say(`${p.name} ${allin?"نزل أول-إن بـ":"راهن"} ${fmt(amt)}`);
  S.pot=Math.max(0,...S.players.map(x=>x.bet));
  fly(p.i,fmt(amt),"chip");
  sfx("chip");
  pileAdd();
  bump();
}
function fold(p){p.folded=true;p.acted=true;p.note="انسحب";say(`${p.name} انسحب`);fly(p.i,"انسحب","out");sfx("fold");pileAdd();}
function botBet(p){
  const opp=Math.max(1,live().length-1),st=strength(p,opp);
  const hb=highBet(),min=hb+STEP;
  const bluff=Math.random()<(S.diff==="hard"?.26:S.diff==="mid"?.10:.03);
  if(p.chips<min){                       // ما يقدر يزيد: إما أول-إن أو انسحاب
    if(st.win>.5||bluff){p._bluff=bluff&&st.win<=.5;return bet(p,p.chips);}
    return fold(p);
  }
  let amt;
  if(st.win>.58)amt=min+STEP*(1+((Math.random()*3)|0));
  else if(st.win>.32)amt=min;
  else if(bluff){amt=min+STEP*((Math.random()*3)|0);p._bluff=true;}
  else return fold(p);
  bet(p,Math.min(amt,Math.floor(p.chips/STEP)*STEP||p.chips));
}
function endBetting(){
  if(S.phase!=="betting")return;        // حارس ضد التكرار
  S.phase="resolving";
  const b=bettors();
  if(b.length===0){say("الكل انسحب — إعادة توزيع","hi");return later(startHand,1300);}
  if(b.length===1){S.pot=b[0].bet;say(`${b[0].name} راهن لحاله — فاز بالجولة بدون كشف، وما تحرّكت فلوس`,"hi");return finishRound();}
  let boss=b[0];for(const p of b)if(p.bet>boss.bet)boss=p;
  S.boss=boss.i;
  say(`${boss.name} أخذ المايك بمراهنة ${fmt(boss.bet)}`,"hi");
  S.pot=boss.bet;
  say(`التقسيمة على ${fmt(boss.bet)} — مراهنة المايك`);
  S.phase="mic";setViewer(boss.i);S.gate=(S.mode==="pass");
  render();
  if(boss.bot)later(()=>botMic(boss),1000);
}

/* ---- المايك وعرض التقسيم ---- */
/* ميل البوت للمداقشة: كل ما صعّبت، داقش أكثر وأذكى.
   th = أدنى احتمال فوز يفكّر عنده · chance = حتى لو توفّر الشرط، ما يداقش إلا بهذي النسبة
   evK = كم لازم يكون الداقش أربح من العرض عشان يرفضه · acc = ميله لقبول العرض */
const DAG={ easy:{th:.88, chance:.18, evK:3.2, acc:.45},
            mid :{th:.74, chance:.55, evK:2.0, acc:.80},
            hard:{th:.60, chance:.92, evK:1.4, acc:1.0} };
const dag=()=>DAG[S.diff]||DAG.mid;

function botMic(boss){
  const st=strength(boss,others().length);
  const d=dag();
  if(st.win>d.th&&!boss._bluff&&Math.random()<d.chance)return dagesh(boss.i);
  const list=bettors(),k=list.length;
  const base=Math.floor(split()/k/STEP)*STEP;
  const shares={};let used=0;
  for(const p of list)if(p.i!==boss.i){
    let s=Math.round(base*(0.65+0.55*(1-st.win))/STEP)*STEP;
    s=Math.max(0,Math.min(s,split()-used));shares[p.i]=s;used+=s;
  }
  shares[boss.i]=split()-used;
  proposeSplit(boss,shares);
}
function proposeSplit(boss,shares){
  for(const p of bettors()){p.share=shares[p.i]||0;p.resp=(p.i===boss.i)?"ok":null;}
  S.phase="offer";
  say(`${boss.name} عرض تقسيم: ${bettors().map(p=>`${p.name} ${fmt(p.share)}`).join(" · ")}`,"hi");
  runResponses();
}
function runResponses(){
  if(S.phase!=="offer")return;
  const pending=others().filter(p=>p.resp===null);
  if(pending.length===0)return settleOffer();
  const p=pending[0];setViewer(p.i);
  if(p.bot){render();S.busy=true;later(()=>{botRespond(p);S.busy=false;runResponses();},750);}
  else{S.gate=(S.mode==="pass");render();}
}
function botRespond(p){
  const st=strength(p,Math.max(1,bettors().length-1)),d=dag();
  const evD=p.bet*(2*st.win-1);                 // ربح متوقّع من الداقش
  if((st.win>d.th||evD>p.share*d.evK)&&Math.random()<d.chance){
    p.resp="dagesh";say(`${p.name} داقش`,"dg");return;
  }
  if(p.share>=evD*d.acc||S.revisions>=2){p.resp="ok";p.note="وافق";say(`${p.name} وافق على ${fmt(p.share)}`);return;}
  p.resp="no";p.note="رفض";say(`${p.name} رفض ويبي أكثر`);
}
function settleOffer(){
  if(S.phase!=="offer")return;          // حارس: ممنوع تتنفّذ مرتين لنفس العرض
  S.phase="settling";
  const list=bettors();
  if(list.some(p=>p.resp==="dagesh")){S.phase="offer";return dagesh(S.boss);}
  if(list.every(p=>p.resp==="ok")){
    say("الكل وافق على التقسيم — ما انكشفت ولا ورقة","hi");
    /* التقسيمة توزيع جوائز: كل واحد ياخذ حصته، والمايك ياخذ الباقي. محد يدفع. */
    for(const p of list) if(p.share>0){
      p.chips+=p.share;
      say(`${p.name} أخذ ${fmt(p.share)}${p.i===S.boss?" (الباقي)":""}`,p.i===S.boss?"hi":"");
    }
    return finishRound();
  }
  // فيه رفض: المايك يعيد العرض أو يداقش
  S.revisions++;S.phase="mic";window._sp=null;
  const boss=S.players[S.boss];setViewer(boss.i);
  say(`فيه من رفض — المايك يعيد العرض أو يداقش`);
  for(const p of others())p.resp=null;
  S.gate=(S.mode==="pass"&&!boss.bot);
  render();
  if(boss.bot)later(()=>{
    if(S.revisions>2)return dagesh(boss.i);
    const st=strength(boss,others().length);
    if(st.win>.5)return dagesh(boss.i);
    const list2=bettors(),shares={};let used=0;
    for(const p of list2)if(p.i!==boss.i){
      const s=Math.min(split()-used,Math.round(p.share*1.5/STEP)*STEP);shares[p.i]=s;used+=s;}
    shares[boss.i]=split()-used;
    if(shares[boss.i]<0)return dagesh(boss.i);
    proposeSplit(boss,shares);
  },1000);
}

/* ---- طلب الانسحاب بإذن المايك ---- */
function requestOut(p){
  p.askOut=true;say(`${p.name} طلب إذن الانسحاب من ${S.players[S.boss].name}`);
  const boss=S.players[S.boss];
  if(boss.bot){later(()=>{
    const ok=Math.random()<.75;
    if(ok){say(`${boss.name} سمح له`);p.folded=true;p.resp="ok";p.share=0;p.note="انسحب بإذن";}
    else{say(`${boss.name} رفض — لازم يكمل`);p.note="رُفض انسحابه";}
    p.askOut=false;render();runResponses();},900);}
  else render();
}
function answerOut(p,ok){
  p.askOut=false;
  if(ok){p.folded=true;p.resp="ok";p.share=0;p.note="انسحب بإذن";say(`سمحت لـ ${p.name} ينسحب`);}
  else{p.note="رُفض انسحابه";say(`رفضت انسحاب ${p.name}`);}
  render();runResponses();
}

/* ---- الداقش ---- */
function dagesh(byIdx){
  if(S.phase==="showdown"||S.phase==="done"||S.phase==="over")return;   // حارس ضد التكرار
  S.phase="showdown";
  say(`داقش — الكل مجبر يقلب ورقه`,"dg");
  const list=bettors();
  for(const p of list)S.revealed.add(p.i);
  let best=list[0];for(const p of list)if(cmp(p.eval,best.eval)>0)best=p;
  const win=list.filter(p=>cmp(p.eval,best.eval)===0);
  render();
  later(()=>award(win,false,list),500);
}
/* كل لاعب في الكشف يربح مبلغ مراهنته لو فاز، أو يخسره لو انهزم */
function award(winners,hidden,shown){
  const list=shown||winners;
  if(!isOnline()||!isSpec()){
    const meIn=list.find(x=>x.i===(S?S.viewer:0));
    if(meIn) sfx(winners.includes(meIn)?"win":"lose");
  }
  for(const p of list){
    if(winners.includes(p)){ p.chips+=p.bet; if(p.bet>0)say(`${p.name} ربح ${fmt(p.bet)}`,"hi"); }
    else { p.chips-=p.bet; if(p.bet>0)say(`${p.name} خسر ${fmt(p.bet)}`); }
  }
  say(winners.length>1?`تعادل بين ${winners.map(w=>w.name).join(" و ")}`
                      :`${winners[0].name} فاز بالجولة`,"hi");
  finishRound(hidden?null:{shown,winners});
}
function finishRound(reveal){
  if(S.phase==="done"||S.phase==="over")return;     // حارس ضد التكرار
  S.pot=0;
  for(const p of S.players)if(!p.out&&p.chips<=0){p.out=true;say(`${p.name} خرج من الجلسة`);}
  S.phase="done";S.gate=false;if(S.mode==="bots")S.viewer=0;
  render();
  const champ=alive().find(p=>p.chips>=goal());
  if(reveal){
    const over=!!champ||alive().length<=endAt();
    if(typeof isHost==="function"&&isHost()){
      const slim=a=>a.map(x=>({name:x.name,hand:x.hand,eval:x.eval}));
      for(const c of NET.conns.values())
        if(c.open)try{c.send({t:"reveal",shown:slim(reveal.shown),winners:slim(reveal.winners),over});}catch(e){}
    }
    revealSheet(reveal.shown,reveal.winners,over);
  }
  else if(champ||alive().length<=endAt())later(()=>endSession(champ),900);
}
function endSession(champ){
  const left=alive().sort((a,b)=>b.chips-a.chips);
  const best=champ||left[0]||S.players[0];
  S.phase="over";
  const why = champ ? `وصل هدف ${fmt(goal())}`
            : left.length<=endAt() ? `بقي ${endAt()} لاعبين — الأعلى رصيداً يفوز` : "";
  ovShow(`<h2>انتهت الجلسة</h2><p><b>${best.name}</b> فاز بـ ${fmt(best.chips)}${why?" — "+why:""}.</p>
   <div class="rows" style="margin:14px 0">${S.players.slice().sort((a,b)=>b.chips-a.chips)
     .map(p=>`<div class="row"><span>${p.name}</span><b>${fmt(p.chips)}</b></div>`).join("")}</div>
   <div class="ctl"><button class="act b-brass" onclick="setup()">جلسة جديدة</button></div>`);
}

/* ================= الصوت =================
   كل الأصوات مولّدة بـ WebAudio — ما فيه ملفات تتحمّل. */
let AC=null, MUTED=(()=>{try{return localStorage.getItem("dagesh-mute")==="1"}catch(e){return false}})();
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function tone(f,dur,type,vol,slide){
  const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,c.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+dur);
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(vol||.12,c.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur+.02);
}
function noise(dur,vol,freq){                    // صوت ورقة تنسحب
  const c=ac(); if(!c)return;
  const n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++){ const t=i/n; d[i]=(Math.random()*2-1)*Math.pow(1-t,2.2); }
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq||2400; bp.Q.value=.8;
  const g=c.createGain(); g.gain.value=vol||.22;
  src.connect(bp);bp.connect(g);g.connect(c.destination);src.start();
}
function sfx(kind){
  if(MUTED)return;
  try{
    switch(kind){
      case "card":   noise(.13,.20,2600); break;
      case "deal":   for(let k=0;k<4;k++)setTimeout(()=>noise(.11,.16,2400+k*180),k*85); break;
      case "chip":   tone(880,.07,"triangle",.10); setTimeout(()=>tone(1320,.09,"triangle",.08),55); break;
      case "fold":   tone(300,.16,"sine",.09,180); noise(.1,.12,1200); break;
      case "turn":   tone(660,.12,"sine",.09); break;
      case "dagesh": noise(.18,.26,1800); setTimeout(()=>tone(220,.3,"sawtooth",.10,110),60); break;
      case "win":    [523,659,784,1046].forEach((f,k)=>setTimeout(()=>tone(f,.28,"triangle",.11),k*95)); break;
      case "lose":   tone(392,.38,"sine",.10,160); break;
      case "msg":    tone(1180,.07,"sine",.07); break;
    }
  }catch(e){}
}
function toggleMute(){
  MUTED=!MUTED;
  try{localStorage.setItem("dagesh-mute",MUTED?"1":"0")}catch(e){}
  const b=$("bMute"); if(b)b.textContent=MUTED?"🔇":"🔊";
  if(!MUTED)sfx("turn");
}

  </g>`;
}

function cardSVG(c,small){
  const red=RED.has(c.s), sd=SUIT_D[c.s];
  if(small) return `<svg class="face-svg ${red?"red":""}" viewBox="0 0 100 140" aria-hidden="true">
     <text class="idx big" x="50" y="52">${c.r}</text>${pip(sd,50,102,0.30)}</svg>`;

  let body;
  if(c.r==="A"){
    body=pip(sd,50,70,0.50);
  }else if(PIPS[c.r]){
    body=PIPS[c.r].map(([x,y])=>pip(sd,x,y,0.185,y>70)).join("");
  }else{                                     // J / Q / K
    body=`<rect class="panel" x="16" y="12" width="68" height="116" rx="4"/>
          <rect class="panel" x="19.5" y="15.5" width="61" height="109" rx="3"/>
          <path class="panel" d="M19.5 70 L80.5 70"/>`
        + courtHalf(c.r,sd)
        + `<g transform="rotate(180 50 70)">${courtHalf(c.r,sd)}</g>`;
  }
  const idx=(x,y,flip)=>`<g transform="translate(${x} ${y}) rotate(${flip?180:0})">
      <text class="idx" x="0" y="0">${c.r}</text>${pip(sd,0,c.r==="10"?13:12,0.085)}</g>`;
  return `<svg class="face-svg ${red?"red":""}" viewBox="0 0 100 140" aria-hidden="true">
    ${body}${idx(10,19)}${idx(90,121,true)}</svg>`;
}
const CDN="https://cdn.jsdelivr.net/gh/richardschneider/cardsJS@master/cards/";
const SUIT_CODE={"♠":"S","♥":"H","♦":"D","♣":"C"};
function cardEl(c,sm,down){
  if(down) return `<div class="card back ${sm?"sm":""}"></div>`;
  const red=RED.has(c.s)?"red":"";
  // المقاعد: رقم وشكل واضحين (صورة الشدّة تصير غير مقروءة بهذا الحجم)
  if(sm) return `<div class="card ${red} sm" title="${AR[c.r]} ${c.s}">${cardSVG(c,true)}</div>`;
  // ورقك والكشف: صورة الشدّة الحقيقية، وتحتها المرسومة كبديل لو فشل التحميل
  const id=c.r+SUIT_CODE[c.s];
  // صورة الشدّة من CDN، وإذا ما وصلت نجرّب النسخة المحلية، وإذا فشلت الاثنتين تبقى المرسومة تحتها
  return `<div class="card ${red}" title="${AR[c.r]} ${c.s}">${cardSVG(c,false)}
    <img class="cardimg" src="${CDN}${id}.svg" alt="" loading="eager"
         onerror="if(this.dataset.f){this.remove()}else{this.dataset.f=1;this.src='cards/${id}.svg'}"></div>`;
}

function pileAdd(){
  const pile=$("pile"); if(!pile)return;
  if(pile.children.length>7)pile.removeChild(pile.firstChild);
  const c=document.createElement("i");
  c.style.setProperty("--rot",(Math.random()*46-23).toFixed(1)+"deg");
  c.style.setProperty("--dx",(Math.random()*16-8).toFixed(0)+"px");
  pile.appendChild(c);
}
function pileClear(){ const pile=$("pile"); if(pile)pile.innerHTML=""; }

function fly(seat,label,kind){
  const ring=$("ring"); if(!ring)return;
  const el=ring.querySelector(`.seat[data-i="${seat}"]`); if(!el)return;
  const rb=ring.getBoundingClientRect(), sb=el.getBoundingClientRect();
  const d=document.createElement("div");
  d.className="fly "+(kind||"");
  d.textContent=label;
  d.style.left=(sb.left-rb.left+sb.width/2)+"px";
  d.style.top =(sb.top -rb.top +sb.height/2)+"px";
  ring.appendChild(d);
  requestAnimationFrame(()=>{
    d.style.left=(rb.width/2)+"px";
    d.style.top =(rb.height/2)+"px";
    d.style.opacity="0";
    d.style.transform="translate(-50%,-50%) scale(.65)";
  });
  setTimeout(()=>d.remove(),720);
}
function bump(){const t=$("tray");t.classList.remove("bump");void t.offsetWidth;t.classList.add("bump");}

function setViewer(i){ if(S.mode==="pass") S.viewer=i; }   // المشاهد يتنقل فقط في وضع تمرير الجوال
let _pushT=null;
/* مين صاحب الدور الحين — مصدر واحد تعتمد عليه كل الواجهة */
function whoseTurn(){
  if(!S)return -1;
  if(S.phase==="betting")return S.order[S.turn]!==undefined?S.order[S.turn]:-1;
  if(S.phase==="mic")return S.boss;
  if(S.phase==="offer"){
    const req=bettors().find(p=>p.askOut);
    if(req)return S.boss;
    const p=bettors().find(x=>x.i!==S.boss&&x.resp===null&&!x.folded);
    return p?p.i:S.boss;
  }
  return -1;
}
function seatBadge(p,turn){
  if(p.out)   return '<span class="badge b-out">خارج</span>';
  if(turn)    return '<span class="badge b-turn">دوره الآن</span>';
  if(S.boss===p.i) return '<span class="badge b-mic">🎤 المايك</span>';
  if(p.folded)return '<span class="badge b-out">منسحب</span>';
  if(p.bet>0) return '<span class="badge b-in">داخل</span>';
  return '<span class="badge b-wait">ينتظر</span>';
}
function seatNote(p){
  if(p.askOut) return "🙋 يطلب إذن الانسحاب";
  if(S.phase==="offer"&&p.bet>0&&!p.folded){
    if(p.resp==="ok")     return `وافق على ${fmt(p.share)}`;
    if(p.resp==="no")     return "رفض ويبي أكثر";
    if(p.resp==="dagesh") return "داقش!";
    if(p.i!==S.boss)      return `عُرض له ${fmt(p.share)}`;
  }
  return p.note||"";
}
function render(){
  if(!S)return;
  if(typeof isHost==="function"&&isHost()&&S.mode==="online"){
    clearTimeout(_pushT);_pushT=setTimeout(pushState,90);
  }
  const v=S.players[S.viewer];
  $("gate").hidden=!S.gate;
  if(S.gate){$("gateName").textContent=`دور ${v.name}`;return;}

  /* اللاعبون حول الطاولة زي الجلسة الحقيقية: انت تحت، والدور يمشي من اليمين لليسار */
  const nn=S.n, small=nn>8;
  $("ring").classList.toggle("tight",small);
  $("seats").innerHTML=S.players.map(p=>{
    const rel=((p.i-S.viewer)%nn+nn)%nn;
    const th=Math.PI/2 - rel*(2*Math.PI/nn);   // عكس عقارب الساعة
    const x=50+ (small?40:37)*Math.cos(th);
    const y=50+ (small?41:38)*Math.sin(th);
    const me=p.i===S.viewer, turn=whoseTurn()===p.i, show=S.revealed.has(p.i);
    const isDealer=S.dealer===p.i;
    return `<div class="seat ${turn?"turn":""} ${p.out||p.folded?"dim":""} ${me?"mine":""}"
      data-i="${p.i}" style="left:${x}%;top:${y}%">
      <i class="ava" style="--h:${(p.i*67)%360}">${(p.name||"?").trim().charAt(0)}${isDealer?'<b class="dlr" title="الموزّع">D</b>':""}</i>
      <span class="nm">${p.name}</span>
      <span class="chipbal num">${fmt(p.chips)}</span>
      <span class="betchip ${p.bet?"on":""} num">${p.bet?fmt(p.bet):"—"}</span>
      ${show?`<div class="mini">${p.hand.map(c=>cardEl(c,true,false)).join("")}</div>
              <span class="badge b-in">${PROJ[p.eval.cat]}</span>`
            : seatBadge(p,turn)}
    </div>`;}).join("");

  $("pot").textContent=fmt(Math.max(0,...S.players.map(p=>p.bet)));
  $("potLabel").textContent = S.phase==="betting" ? "أعلى مراهنة" : "التقسيمة";
  $("youName").textContent=S.mode==="bots"?"ورقك":`ورق ${v.name}`;
  $("myChips").textContent=fmt(v.chips);
  document.querySelector(".myrow").style.display=isSpec()?"none":"";
  $("hand").innerHTML=v.hand.map((c,i)=>`<div class="deal" style="animation-delay:${i*60}ms">${cardEl(c)}</div>`).join("");
  $("proj").textContent=v.hand.length?pdetail(v.eval):"";

  $("log").innerHTML=S.log.map(l=>`<p class="${l.c||""}">${l.t}</p>`).join("");
  $("bNew").style.display=(isOnline()&&!isHost())?"none":"";   // الضيف ما يقدر ينهي الجلسة
  $("chatSec").hidden=!isOnline();
  $("rosterSec").hidden=!isOnline();
  if(isOnline()){
    renderChat();
    const d=isHost()?rosterMsg():(NET.lobby||{players:[],specs:[]});
    $("rosterBox").innerHTML=rosterRows(d.players||[],d.specs||[],isHost());
  }
  // مؤشر المرحلة: الجزء الأول أكشن، الجزء الثاني مناقشة
  const stage = S.phase==="betting" ? 1 : (S.phase==="done"||S.phase==="over") ? 0 : 2;
  [...$("stepper").children].forEach(el=>{
    const n=+el.dataset.s;
    el.classList.toggle("on",  n===stage);
    el.classList.toggle("done",stage>n);
  });

  // شريط "دور مين" — أوضح شي في الشاشة
  const t0=whoseTurn();
  if(t0===S.viewer && S._lastTurn!==t0 && !isSpec()) sfx("turn");
  S._lastTurn=t0;
  const t=t0, tb=$("turnbar");
  if(S.phase==="showdown"){
    tb.className="turn dagesh"; tb.innerHTML=`<b>داقش!</b><span>الكل يقلب ورقه</span>`;
  }else if(S.phase==="done"||S.phase==="over"){
    tb.className="turn quiet"; tb.innerHTML=`<b>انتهت الجولة</b><span>القدر انوزّع</span>`;
  }else if(t>=0){
    const p=S.players[t], mine=t===S.viewer;
    tb.className="turn"+(mine?" mine":"");
    const what = S.phase==="betting" ? "يراهن أو ينسحب"
               : S.phase==="mic"     ? "يعرض التقسيم أو يداقش"
               : bettors().some(x=>x.askOut) ? "يرد على طلب الانسحاب"
               : "يرد على العرض";
    tb.innerHTML=`<b>${mine?"دورك":"دور "+p.name}</b><span>${what}</span>`;
  }else{ tb.className="turn quiet"; tb.innerHTML=`<b>…</b><span>لحظة</span>`; }

  const ph={betting:"الجزء الأول — الأكشن",mic:"الجزء الثاني — المناقشة",
            offer:"الجزء الثاني — المناقشة",showdown:"داقش — كشف الأوراق",
            done:"انتهت الجولة"}[S.phase]||"";
  $("phase").textContent=S.boss>=0&&S.phase!=="betting"
    ? `${ph} · المايك مع ${S.players[S.boss].name} (أعلى مراهنة ${fmt(S.players[S.boss].bet)})`
    : ph;
  actions();
}

function actions(){
  const bar=$("actions"),v=S.players[S.viewer];
  if(isSpec()){
    bar.innerHTML=`<div class="prompt spec-note"><b>انت متفرّج.</b>
      تشوف المراهنات والعروض والكشف، بس ما تقدر تلعب هالجلسة.</div>`;
    return;
  }
  setTimeout(()=>{const r=$("rg"); if(r)rgSync(r);},0);
  /* الداقش شغّال دايماً لأي لاعب داخل الجولة، حتى لو مو دوره */
  const canDagesh = (S.phase==="mic"||S.phase==="offer") && v.bet>0 && !v.folded && !v.out && !S.revealed.has(v.i);
  const alwaysDagesh = canDagesh
    ? `<div class="always-dagesh"><button class="act b-pom" onclick="askDagesh('dagesh-any')">داقش الآن — اكشف الورق</button>
       <span>تقدر تداقش في أي لحظة، حتى لو مو دورك</span></div>` : "";
  const H=(p,c)=>bar.innerHTML=`<div class="prompt">${p}</div><div class="ctl">${c}</div>${alwaysDagesh}`;

  if(S.phase==="done"||S.phase==="over")
    return H("الجولة خلصت.",`<button class="act b-brass" onclick="act('next')">الجولة الجاية</button>`);

  // طلبات انسحاب معلّقة عندك كصاحب مايك
  if(S.boss===S.viewer){
    const req=bettors().find(p=>p.askOut);
    if(req)return H(`<b>${req.name}</b> يطلب إذنك ينسحب من الجولة. لك ترفض وتجبره يكمل.`,
      `<button class="act b-quiet" onclick="act('answerout',{target:${req.i},ok:true})">أسمح له</button>
       <button class="act b-pom" onclick="act('answerout',{target:${req.i},ok:false})">أرفض</button>`);
  }
  // دورك في المراهنة
  if(S.phase==="betting"&&S.order[S.turn]===S.viewer&&!v.folded&&!v.bot){
    const hb=highBet(),min=hb+STEP;
    if(v.chips<min)
      return H(`أعلى مراهنة الحين <b>${fmt(hb)}</b> وما عندك أكثر منها. إما تنزل <b>أول-إن</b> بكل رصيدك أو تنسحب.`,
        `<button class="act b-brass" onclick="act('bet',{amount:${v.chips}})">أول-إن ${fmt(v.chips)}</button>
         <button class="act b-quiet" onclick="act('fold')">انسحب</button>`);
    const max=Math.floor(v.chips/STEP)*STEP;
    return H(`دورك. ${hb?`أعلى مراهنة <b>${fmt(hb)}</b>، لازم تزيد 5,000 على الأقل.`:`ابدأ المراهنة، الحد الأدنى <b>5,000</b>.`}`,
      `<div class="amt">
         <input type="range" id="rg" min="${min}" max="${max}" step="${STEP}" value="${min}"
                aria-label="مبلغ المراهنة"
                oninput="rgSync(this)">
         <span class="amtval num" id="og">${fmt(min)}</span>
       </div>
       <button class="act b-brass" onclick="act('bet',{amount:+document.getElementById('rg').value})">راهن</button>
       <button class="act b-quiet" onclick="act('fold')">انسحب</button>`);
  }
  // انت صاحب المايك
  if(S.phase==="mic"&&S.boss===S.viewer&&!v.bot){
    const list=bettors();
    if(!window._sp||window._spPot!==split()||window._spN!==list.length){
      window._sp={};window._spPot=split();window._spN=list.length;
      const b=Math.floor(split()/list.length/STEP)*STEP;let u=0;
      for(const p of list)if(p.i!==S.viewer){window._sp[p.i]=b;u+=b;}
    }
    const used=Object.values(window._sp).reduce((a,b)=>a+b,0),mine=split()-used;
    const rows=list.filter(p=>p.i!==S.viewer).map(p=>`<div class="sp-row">
      <span class="nm">${p.name}</span>
      <button class="stp" onclick="spAdj(${p.i},-1)">−</button>
      <span class="val num">${fmt(window._sp[p.i]||0)}</span>
      <button class="stp" onclick="spAdj(${p.i},1)">+</button></div>`).join("");
    return H(`تقسيمتك <b>${fmt(split())}</b> — وهي مراهنتك، وتدفعها من محفظتك للي يوافق. وزّع زي ما تبي — تقدر تعطي واحد أكثر عشان يوافق. لو وافقوا كلهم، ما ينكشف ورق أحد.`,
      `<div class="split">${rows}
        <div class="sp-row" style="border-top:1px solid var(--line);padding-top:7px">
          <span class="nm">حصتك</span><span class="val num">${fmt(mine)}</span></div>
        <div class="left ${mine<0?"bad":""}">${mine<0?"التوزيع تعدّى القدر":"المجموع لازم يساوي القدر"}</div></div>
       <button class="act b-brass" ${mine<0?"disabled":""} onclick="uOffer()">اعرض التقسيم</button>
       <button class="act b-pom" onclick="askDagesh('mic-dagesh')">داقش</button>`);
  }
  // ردّك على العرض
  if(S.phase==="offer"&&S.viewer!==S.boss&&v.resp===null&&!v.bot&&!v.folded){
    return H(`${S.players[S.boss].name} عارض عليك <b>${fmt(v.share)}</b>. لو وافقت تدخل محفظتك على طول. ولو داقشت وكسبت تاخذ مراهنتك <b>${fmt(v.bet)}</b>، ولو خسرت تروح عليك.`,
      `<button class="act b-brass" onclick="act('resp',{r:'ok'})">أوافق ${fmt(v.share)}</button>
       <button class="act b-quiet" onclick="act('resp',{r:'no'})">أبي أكثر</button>
       <button class="act b-quiet" style="flex:0 0 100%" onclick="act('askout')">اطلب إذن الانسحاب</button>`);
  }
  H(S.busy?"في انتظار بقية اللاعبين…":"…","");
}

function uBet(a){bet(S.players[S.viewer],a);S.turn++;advance();}
function uFold(){fold(S.players[S.viewer]);S.turn++;advance();}
/* تعبئة شريط السلايدر + تحديث الرقم */
function rgSync(el){
  const mn=+el.min, mx=+el.max, v=+el.value;
  el.style.setProperty("--fill", (mx>mn?((v-mn)/(mx-mn)*100):0)+"%");
  const o=$("og"); if(o)o.textContent=Number(v).toLocaleString("en-US");
}
function askDagesh(kind){
  const v=S.players[S.viewer];
  ovShow(`<div class="hero sm"><h2>تداقش؟</h2>
    <p>الكل بيقلب ورقه على طول. لو مشروعك الأقوى تربح <b>${fmt(v.bet)}</b>،
       ولو انهزمت تروح عليك.</p></div>
    <div class="ctl">
      <button class="act b-quiet" onclick="ovHide()">لا، رجّعني</button>
      <button class="act b-pom" onclick="ovHide();act('${kind}')">نعم، داقش</button>
    </div>`);
}
function spAdj(i,dir){
  const cur=window._sp[i]||0,used=Object.values(window._sp).reduce((a,b)=>a+b,0);
  const next=cur+dir*STEP;
  if(next<0)return;
  if(dir>0&&used+STEP>split())return;
  window._sp[i]=next;render();
}
function uOffer(){
  const sh={...window._sp};
  sh[S.viewer]=split()-Object.values(window._sp).reduce((a,b)=>a+b,0);
  window._sp=null;act("offer",{shares:sh});
}
function uResp(r){
  const p=S.players[S.viewer];p.resp=r;
  if(r==="dagesh"){say(`${p.name} داقش`,"dg");}
  else if(r==="ok"){p.note="وافق";say(`${p.name} وافق على ${fmt(p.share)}`);}
  else{p.note="رفض";say(`${p.name} رفض ويبي أكثر`);}
  runResponses();
}
