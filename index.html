<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="داقش — لعبة ورق خليجية أساسها المساومة والبلوف. العب مع أصحابك من أي جهاز.">
<meta name="theme-color" content="#0B1716">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="logo-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="داقش">
<meta property="og:type" content="website">
<meta property="og:site_name" content="داقش">
<meta property="og:title" content="داقش — ورق، مساومة، وبلوف">
<meta property="og:description" content="لعبة ورق خليجية أساسها المساومة والبلوف. العب مع أصحابك، كل واحد من جهازه.">
<meta property="og:url" content="https://waelsaballyl.github.io/dagesh/">
<meta property="og:image" content="https://waelsaballyl.github.io/dagesh/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="داقش — ورق، مساومة، وبلوف">
<meta name="twitter:description" content="لعبة ورق خليجية أساسها المساومة والبلوف. العب مع أصحابك، كل واحد من جهازه.">
<meta name="twitter:image" content="https://waelsaballyl.github.io/dagesh/og.png">
<title>داقش</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --paper:#0C0F11; --paper-2:#14181B; --paper-3:#1C2225;
  --ink:#EEF1EF; --ink-2:#A7AFB1; --ink-3:#6D7578;
  --rule:#232A2D; --rule-2:#333B3F;
  --accent:#E06A75; --accent-soft:#2B1618; --accent-line:#8C3A42;
  --gain:#4FC08C; --gain-soft:#122720;
  --warn:#D8A64E; --warn-soft:#26200F;
  --white:#F7F6F1;
  --felt:#101A18;
  --r:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);direction:rtl;
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Alexandria","IBM Plex Sans Arabic",sans-serif;font-weight:800;
  letter-spacing:-.02em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}

.app{max-width:660px;margin:0 auto;padding:0 16px 330px}

/* ---------- الترويسة ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:18px 0 14px;border-bottom:2px solid var(--ink)}
.bar h1{font-size:26px;line-height:1}
.bar .sub{font-size:10px;letter-spacing:.3em;color:var(--ink-3);padding-top:6px;margin-inline-end:auto}
.bar nav{display:flex;gap:6px}
.tbtn{background:none;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:var(--r);
  padding:7px 12px;font-size:12px;transition:.15s}
.tbtn:hover{border-color:var(--ink);color:var(--ink)}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- الشبكة ---------- */
.grid{display:flex;flex-direction:column}
.board{order:1;padding-top:16px}                 /* الطاولة فوق */
.rail{order:2;border-top:1px solid var(--rule);padding-top:18px;margin-top:28px}  /* السجل والاستنتاج تحت */

/* ---------- مرحلة الجولة ---------- */
.stage{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.step{flex:1;display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--paper-2);
  border-inline-start:1px solid var(--rule);transition:.2s}
.step:first-child{border-inline-start:0}
.step b{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:var(--paper-3);color:var(--ink-3);font-family:"Alexandria",sans-serif}
.step span{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.step.on{background:var(--ink)}
.step.on b{background:var(--paper);color:var(--ink)}
.step.on span{color:var(--paper);font-weight:600}
.step.done b{background:var(--gain-soft);color:var(--gain)}

/* ---------- دور مين ---------- */
#turnbar{display:flex;align-items:baseline;gap:10px;padding:14px 0;border-bottom:1px solid var(--rule);margin-bottom:4px}
#turnbar b{font-family:"Alexandria",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
#turnbar span{font-size:12.5px;color:var(--ink-2)}
#turnbar span::before{content:"·";margin-inline-end:9px;color:var(--rule-2)}
#turnbar.mine b{color:var(--accent)}
#turnbar.mine::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
  margin-inline-start:auto;align-self:center;animation:blip 1.2s infinite}
@keyframes blip{50%{opacity:.2}}
#turnbar.dagesh b{color:var(--accent)}
#turnbar.quiet b{color:var(--ink-3)}

/* ---------- الطاولة الدائرية ---------- */
.ring{position:relative;width:100%;max-width:560px;margin:22px auto 10px;aspect-ratio:1/1.05}
.felt{position:absolute;inset:15% 12%;border-radius:50%;
  background:radial-gradient(70% 70% at 50% 40%,#16211F 0%,var(--felt) 70%);
  border:1px solid var(--rule);box-shadow:inset 0 0 60px rgba(0,0,0,.55)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:2}
.core .lbl{font-size:9.5px;letter-spacing:.24em;color:var(--ink-3)}
.core .val{font-family:"Alexandria",sans-serif;font-weight:800;font-size:32px;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.core .ph{font-size:10.5px;color:var(--ink-3);max-width:170px;line-height:1.4}
.core.bump .val{animation:pop .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{45%{transform:scale(1.1)}}

.seats{position:absolute;inset:0}
.seat{position:absolute;transform:translate(-50%,-50%);width:96px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;
  padding:7px 5px 6px;transition:.22s;z-index:3}
.ring.tight .seat{width:84px;padding:6px 4px}
.seat.turn{border-color:var(--warn);background:var(--warn-soft);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.seat.dim{opacity:.4}
.seat.mine{border-color:var(--accent-line);background:var(--accent-soft)}
.seat .nm{font-family:"Alexandria",sans-serif;font-weight:600;font-size:12px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .chipbal{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.seat .betchip{font-family:"Alexandria",sans-serif;font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums;color:var(--ink-3);line-height:1.1}
.seat .betchip.on{color:var(--warn)}
.ring.tight .seat .betchip{font-size:13px}
.badge{font-size:8.5px;padding:1.5px 6px;border-radius:3px;white-space:nowrap;font-weight:600}
.b-mic{background:var(--accent);color:#1A0C0E}
.b-turn{background:var(--warn);color:#191400}
.b-in{background:var(--gain-soft);color:var(--gain)}
.b-out{background:var(--paper-3);color:var(--ink-3)}
.b-wait{border:1px dashed var(--rule-2);color:var(--ink-3)}
.seat .mini{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap;
  height:24px;align-items:center}
.seat .mini .card.sm{width:17px;height:24px;border-radius:2px;box-shadow:none}
.seat .mini .card.sm .face-svg .idx.big{font-size:78px}
.ring.tight .seat .mini .card.sm{width:14px;height:20px}
.seat .backs{display:flex;gap:2px}
.seat .backs i{width:9px;height:13px;border-radius:2px;background:var(--accent-line);
  border:1px solid rgba(0,0,0,.4);display:block}
.seat .note{font-size:9px;color:var(--ink-3);text-align:center;line-height:1.3;min-height:11px;
  max-width:100%;overflow:hidden}
.you-tag{display:none}

.fly{position:absolute;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  font-family:"Alexandria",sans-serif;font-weight:800;font-size:13px;padding:5px 11px;border-radius:99px;
  transition:left .6s cubic-bezier(.3,.8,.3,1),top .6s cubic-bezier(.3,.8,.3,1),
             opacity .6s ease,transform .6s ease}
.fly.chip{background:var(--warn);color:#191400;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.fly.out{background:var(--paper-3);color:var(--ink-3);font-size:11px}

@media(max-width:520px){
  .ring{max-width:none;aspect-ratio:1/1.22;margin-top:14px}
  .seat{width:80px;padding:6px 4px;gap:2px}
  .seat .nm{font-size:11px}
  .seat .betchip{font-size:14px}
  .ring.tight .seat{width:68px;padding:5px 3px}
  .core .val{font-size:25px}
  .core .ph{max-width:130px;font-size:9.5px}
}

/* ---------- الأوراق ---------- */
.card{width:62px;height:88px;border-radius:5px;background:var(--white);flex:none;overflow:hidden;
  position:relative;border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.face-svg{width:100%;height:100%;display:block;color:#16242C}
.face-svg.red{color:#A8232E}
.face-svg path,.face-svg circle,.face-svg rect{fill:currentColor}
.face-svg .face{fill:#EFD8BE;stroke:currentColor;stroke-width:1.3}
.face-svg .robe{fill:currentColor;opacity:.8}
.face-svg .panel{fill:none;stroke:currentColor;stroke-width:1.1;opacity:.38}
.face-svg .ink-s{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.face-svg .idx{font:800 24px "Alexandria",sans-serif;text-anchor:middle;dominant-baseline:central}
.face-svg .idx.big{font-size:54px}
.card.sm{width:30px;height:43px;border-radius:3px}
.card.sm .mini-idx{display:none}
.card.back{background:var(--accent);border-color:rgba(0,0,0,.3)}
.card.back::after{content:"";position:absolute;inset:4px;border-radius:2px;
  background:repeating-linear-gradient(-45deg,transparent 0 4px,rgba(255,255,255,.16) 4px 8px);
  outline:1px solid rgba(255,255,255,.3)}
.cardimg{position:absolute;inset:0;width:100%;height:100%;display:block;background:#fff}
.deal{animation:deal .4s cubic-bezier(.2,.85,.3,1) backwards}
@keyframes deal{from{transform:translateY(-18px);opacity:0}}

/* ---------- ورقك ---------- */
.mine-sec{padding:18px 0 0}
.mine-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mine-head h2{font-size:15px}
.mine-head .sp{flex:1}
.stat{font-size:10px;letter-spacing:.18em;color:var(--ink-3)}
.stat b{display:block;font-family:"Alexandria",sans-serif;font-weight:800;font-size:19px;
  color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hand{display:flex;gap:9px;justify-content:center}
.hand .card{width:84px;height:122px;border-radius:7px}
.project{text-align:center;margin-top:14px;font-family:"Alexandria",sans-serif;font-weight:800;
  font-size:21px;color:var(--accent);letter-spacing:-.02em}

/* ---------- شريط الأفعال ---------- */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:12;background:var(--paper);
  border-top:2px solid var(--ink);box-shadow:0 -6px 24px rgba(0,0,0,.10)}
.dock-in{max-width:660px;margin:0 auto;padding:13px 16px calc(13px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:11px}
.prompt{font-size:13.5px;color:var(--ink-2)}
.prompt b{color:var(--ink);font-weight:600}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.act{font-size:14.5px;font-weight:600;border-radius:var(--r);padding:13px 18px;
  border:1px solid transparent;flex:1;min-width:112px;transition:.15s}
button.act:hover{filter:brightness(1.07)}
button.act:active{transform:translateY(1px)}
button.act[disabled]{opacity:.35;cursor:not-allowed}
.b-brass{background:var(--ink);color:var(--paper)}
.b-pom{background:var(--accent);color:var(--white)}
.b-quiet{background:transparent;border-color:var(--rule-2);color:var(--ink-2)}
.b-quiet:hover{border-color:var(--ink);color:var(--ink)}
.amt{display:flex;align-items:center;gap:11px;width:100%}

.amt output{font-variant-numeric:tabular-nums;font-family:"Alexandria",sans-serif;font-weight:800;
  min-width:104px;text-align:center;background:var(--paper-2);border:1px solid var(--rule);
  border-radius:var(--r);padding:9px 8px;font-size:17px}
.always-dagesh{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed var(--rule-2)}
.always-dagesh button{flex:0 0 auto;min-width:auto;padding:9px 16px;font-size:13px}
.always-dagesh span{font-size:11px;color:var(--ink-3)}

/* ---------- محرّر التقسيم ---------- */
.split{display:flex;flex-direction:column;gap:7px;width:100%}
.sp-row{display:flex;align-items:center;gap:9px;font-size:13px}
.sp-row .nm{flex:1;font-family:"Alexandria",sans-serif;font-weight:600}
.sp-row .val{font-variant-numeric:tabular-nums;min-width:88px;text-align:center;font-weight:700;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);padding:7px}
.stp{width:36px;height:36px;border-radius:var(--r);border:1px solid var(--rule-2);
  background:transparent;color:var(--ink);font-size:18px;flex:none}
.stp:active{background:var(--paper-2)}
.left{font-size:11.5px;color:var(--ink-3);text-align:center}
.left.bad{color:var(--accent)}

/* ---------- الشريط الجانبي ---------- */
.rail section+section{margin-top:22px}
.rail h3{font-size:10px;letter-spacing:.26em;color:var(--ink-3);margin-bottom:10px;
  font-family:"IBM Plex Sans Arabic";font-weight:600}
.logbox{display:flex;flex-direction:column;font-size:12px;max-height:340px;overflow-y:auto}
.chatbox{display:flex;flex-direction:column;font-size:12.5px;max-height:180px;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:var(--paper-2);border-radius:var(--r);padding:4px 10px}
.chatbox:empty{display:none}
.chatbox p{margin:0;color:var(--ink-2);padding:6px 0;border-bottom:1px solid var(--rule);line-height:1.55;
  overflow-wrap:anywhere}
.chatbox p:last-child{border-bottom:0}
.chatbox p b{color:var(--ink);font-weight:600}
.chatbox p.mine b{color:var(--warn)}
.chatrow{display:flex;gap:8px;margin-top:8px}
.chatrow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:var(--r);
  background:var(--paper-2);border:1px solid var(--rule-2);color:var(--ink)}
.chatrow input:focus{outline:none;border-color:var(--warn)}
.chatrow button{flex:0 0 auto;padding-inline:14px}
.logbox p{margin:0;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--rule);line-height:1.5}
.logbox p:last-child{border-bottom:0}
.logbox p.hi{color:var(--ink);font-weight:600}
.logbox p.dg{color:var(--accent);font-weight:600}
.rows{display:flex;flex-direction:column;font-size:12.5px}
.row{display:flex;justify-content:space-between;gap:10px;color:var(--ink-3);padding:6px 0;
  border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10px;border:1px solid var(--rule);color:var(--ink-3);border-radius:3px;padding:2px 6px}

/* ---------- شاشة تمرير الجوال ---------- */
.gate{position:fixed;inset:0;z-index:15;background:var(--paper);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;padding:26px;text-align:center}
.gate[hidden]{display:none}
.gate h2{font-size:36px}
.gate p{color:var(--ink-2);max-width:320px;margin:0;font-size:14px}

/* ---------- النوافذ ---------- */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;
  overscroll-behavior:contain;touch-action:none}
.ov[hidden]{display:none}
/* وقت ما تكون النافذة مفتوحة، الخلفية تتثبّت — قبل كان السحب يمرّر الصفحة اللي تحت */
body.noscroll{position:fixed;inset-inline:0;width:100%;overflow:hidden}
.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:26px;
  max-width:520px;width:100%;max-height:88vh;max-height:88dvh;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  animation:rise .28s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.sheet h2{font-size:28px;margin-bottom:8px}
.sheet p,.sheet li{color:var(--ink-2);font-size:13.5px}
.sheet ol{padding-inline-start:18px}.sheet li{margin-bottom:6px}
.rev{display:flex;flex-direction:column;margin:16px 0;border-top:1px solid var(--rule)}
.rev-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--rule)}
.rev-row .w{font-family:"Alexandria",sans-serif;font-weight:600;font-size:13.5px;min-width:62px}
.rev-row .p{font-size:11.5px;color:var(--ink-3);margin-inline-start:auto;text-align:end}
.rev-row.win .p{color:var(--gain);font-weight:700}

/* ---------- الإعدادات ---------- */
.opt{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.opt label,.field label{font-size:10px;letter-spacing:.24em;color:var(--ink-3)}
.segs{display:flex;gap:5px;flex-wrap:wrap}
.segs button{font-size:13.5px;padding:9px 13px;border-radius:var(--r);background:transparent;
  border:1px solid var(--rule-2);color:var(--ink-2);transition:.15s;min-width:46px;flex:1}
.segs button:hover{border-color:var(--ink)}
.segs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field input{font:inherit;font-size:16px;padding:12px 13px;border-radius:var(--r);background:var(--paper-2);
  border:1px solid var(--rule-2);color:var(--ink);width:100%}
.field input:focus{border-color:var(--ink)}
.field input.bad{border-color:var(--accent);background:var(--accent-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.field .err{font-size:11px;color:var(--accent)}
.field input.code{text-align:center;letter-spacing:.55em;text-indent:.55em;direction:ltr;
  font-family:"Alexandria",sans-serif;font-weight:800;font-size:30px}
.roomcode{font-family:"Alexandria",sans-serif;font-weight:800;font-size:56px;letter-spacing:.2em;
  text-indent:.2em;text-align:center;padding:16px 8px;margin:14px 0;direction:ltr;
  border-block:2px solid var(--ink)}
.lobby-list{display:flex;flex-direction:column;margin:14px 0;border-top:1px solid var(--rule)}
.lobby-p{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.lobby-p .dot{width:7px;height:7px;border-radius:50%;background:var(--gain);flex:none}
.lobby-p .me{margin-inline-start:auto;font-size:10.5px;color:var(--accent)}
.warn{font-size:12px;color:var(--ink-2);border-inline-start:2px solid var(--rule-2);
  padding-inline-start:11px;margin-top:12px;line-height:1.65}
.conn{font-size:12px;color:var(--ink-3);text-align:center}
.pc-note{font-size:11.5px;color:var(--ink-3);margin:8px 0 0;line-height:1.6}
.pc-or{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--ink-3);font-size:11px}
.pc-or::before,.pc-or::after{content:"";flex:1;height:1px;background:var(--rule)}
.brw-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule)}
.brw-row:last-child{border-bottom:0}
.brw-i{display:flex;flex-direction:column;gap:2px;min-width:0}
.brw-i b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brw-i span{font-size:11.5px;color:var(--ink-3)}
.brw-row .act{margin-inline-start:auto;flex:none}

.hero{margin-bottom:22px}
.brandmark{display:block;border-radius:20px;margin-bottom:14px;

.hero h2{font-size:40px;line-height:1;margin-bottom:10px;letter-spacing:-.04em}

button.act.wide{width:100%;flex:none;margin-top:4px}

ol.proj{list-style:none;padding:0;margin:0;counter-reset:pj}

/* ===== أزرار المراهنة بدل السلايدر ===== */

  width:38px;height:38px;margin-top:-14px;border-radius:50%;background:var(--warn);

<script>
/* مصدر احتياطي لو انحجب الأول */
if(typeof mqtt==="undefined"){
  document.write('<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"><\/script>');

<script>
"use strict";
/* ================= داقش — المحرّك =================
   الشدّة مقفولة: لكل لاعب مرتبة وحدة بأشكالها الأربعة. */
const RANKS=["A","K","Q","J","10","9","8","7","6","5","4","3","2"];  // 13 مرتبة = 52 ورقة
const AR={A:"أكة",K:"شايب",Q:"بنت",J:"ولد","10":"عشرة","9":"تسعة","8":"ثمانية",
          "7":"سبعة","6":"ستة","5":"خمسة","4":"أربعة","3":"ثلاثة","2":"اثنين"};
const SUITS=["♠","♥","♦","♣"], RED=new Set(["♥","♦"]);
const START=100000, STEP=5000;
const PROJ={6:"رباعية",5:"مية",4:"ثلاثية",3:"دبل ثنائية",2:"ثنائية",1:"ورق عادي"};
const BOTNAMES=["فيصل","نورة","سعد","منى","خالد","عبدالملك","ريم","تركي","لطيفة","بدر","هيا","ماجد"];

let S=null, ranks=[], rv={}, ri={};

function buildRanks(n){ranks=RANKS.slice(0,n);rv={};ri={};ranks.forEach((r,i)=>{ri[r]=i;rv[r]=ranks.length-i;});}
/* عشوائية تشفيرية + رفض التحيّز: كل ترتيب احتماله متساوي تماماً */
function rnd(n){
  if(window.crypto&&crypto.getRandomValues){
    const lim=Math.floor(4294967296/n)*n, a=new Uint32Array(1);
    let v; do{crypto.getRandomValues(a);v=a[0];}while(v>=lim);
    return v%n;
  }
  return (Math.random()*n)|0;
}
function deck(){
  const d=[];for(const r of ranks)for(const s of SUITS)d.push({r,s});
  for(let k=0;k<3;k++)                       // ثلاث خلطات كاملة
    for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]];}
  return d;
}

/* ---- تقييم المشروع ---- */
function ev(cards){
  const byR={},byS={};
  for(const c of cards){(byR[c.r]=byR[c.r]||0);byR[c.r]++;byS[c.s]=(byS[c.s]||0)+1;}
  const g=Object.keys(byR).map(r=>({r,n:byR[r],v:rv[r]})).sort((a,b)=>b.n-a.n||b.v-a.v);
  if(g[0].n===4)return{cat:6,tb:[g[0].v]};
  if(g.length===4){
    const same=Object.keys(byS).length===1;
    const ix=g.map(x=>ri[x.r]).sort((a,b)=>a-b);
    let run=true;for(let i=1;i<ix.length;i++)if(ix[i]!==ix[i-1]+1)run=false;
    if(same&&run)return{cat:5,tb:[Math.max(...g.map(x=>x.v))]};
  }
  if(g[0].n===3)return{cat:4,tb:[g[0].v,g[1].v]};
  if(g[0].n===2&&g[1]&&g[1].n===2)return{cat:3,tb:[Math.max(g[0].v,g[1].v),Math.min(g[0].v,g[1].v)]};
  if(g[0].n===2)return{cat:2,tb:[g[0].v,...g.slice(1).map(x=>x.v).sort((a,b)=>b-a)]};
  return{cat:1,tb:g.map(x=>x.v).sort((a,b)=>b-a)};
}
function cmp(a,b){if(a.cat!==b.cat)return a.cat-b.cat;
  for(let i=0;i<4;i++){const x=a.tb[i]||0,y=b.tb[i]||0;if(x!==y)return x-y;}return 0;}
const rname=v=>Object.keys(rv).find(r=>rv[r]===v);
function pdetail(e){switch(e.cat){
  case 6:return`رباعية ${AR[rname(e.tb[0])]}`; case 5:return`مية من ${AR[rname(e.tb[0])]}`;
  case 4:return`ثلاثية ${AR[rname(e.tb[0])]}`; case 3:return`${AR[rname(e.tb[0])]} و${AR[rname(e.tb[1])]}`;
  case 2:return`ثنائية ${AR[rname(e.tb[0])]}`; default:return`أعلى ورقة ${AR[rname(e.tb[0])]}`;}}

/* ---- الاحتمالات: الشدّة مقفولة فنعدّ كل التركيبات ---- */
function unknownFor(hand){const m=new Set(hand.map(c=>c.r+c.s));const u=[];
  for(const r of ranks)for(const s of SUITS)if(!m.has(r+s))u.push({r,s});return u;}
function probs(p){
  const key=p.hand.map(c=>c.r+c.s).join();
  if(p._k===key)return p._p;
  const u=unknownFor(p.hand),me=p.eval;let t=0,b=0,q=0;
  if(u.length<=20){                       // شدّة صغيرة: نعدّ كل الاحتمالات بالضبط
    for(let a=0;a<u.length-3;a++)for(let c=a+1;c<u.length-2;c++)for(let d=c+1;d<u.length-1;d++)for(let f=d+1;f<u.length;f++){
      t++;const r=cmp(ev([u[a],u[c],u[d],u[f]]),me);if(r>0)b++;else if(r===0)q++;}
  }else{                                  // شدّة كبيرة: عيّنة عشوائية، دقتها كافية وسريعة
    const N=5000, pick=new Array(4);
    for(let i=0;i<N;i++){
      for(let j=0;j<4;j++){
        let x; do{ x=u[(Math.random()*u.length)|0]; }while(pick.indexOf(x)>=0&&j>0);
        pick[j]=x;
      }
      t++;const r=cmp(ev(pick),me);if(r>0)b++;else if(r===0)q++;
    }
  }
  p._k=key;p._p={single:1-b/t-q/t,tie:q/t};return p._p;
}
function strength(p,opp){const s=probs(p).single;return{single:s,win:Math.pow(s,Math.max(1,opp))};}

/* ---- الجلسة ---- */
const GOAL=1000000;          // هدف الفوز ثابت
function newSession(n,mode,diff,names){
  buildRanks(n);
  S={n,mode,diff,dealer:(Math.random()*n)|0,pot:0,boss:-1,phase:"",turn:0,order:[],
     goal:GOAL,
     log:[],revealed:new Set(),handNo:0,epoch:0,revisions:0,gate:false,viewer:0,busy:false,
     players:Array.from({length:n},(_,i)=>({
       i,name:names[i],bot:mode==="bots"&&i!==0,chips:START,hand:[],eval:null,
       bet:0,folded:false,out:false,acted:false,note:"",resp:null,share:0,askOut:false}))};
  startHand();
}
/* مؤقّت مربوط بالجولة: لو بدأت جولة جديدة، المهام القديمة تُلغى بدل ما تعبث بالحالة */
function later(fn,ms){
  const ep=S.epoch;
  return setTimeout(()=>{ if(S&&S.epoch===ep) fn(); },ms);
}
const alive=()=>S.players.filter(p=>!p.out);
/* 4 إلى 6 لاعبين ← تنتهي على اثنين. 7 فأكثر ← تنتهي على ثلاثة. */
const endAt=()=>S.n>=7?3:2;
const goal=()=>S.goal||1000000;       // أول لاعب يوصله يفوز
const live=()=>S.players.filter(p=>!p.out&&!p.folded);
const bettors=()=>S.players.filter(p=>!p.out&&!p.folded&&p.bet>0);
const others=()=>bettors().filter(p=>p.i!==S.boss);
const split=()=>S.boss>=0?S.players[S.boss].bet:0;   // المبلغ اللي ينقسم = مراهنة المايك
function say(t,c){S.log.unshift({t,c});if(S.log.length>50)S.log.pop();}

function startHand(){
  const champ0=alive().find(p=>p.chips>=goal());        // فحص الفوز هنا كمان،
  if(champ0)return endSession(champ0);                  // عشان ما يضيع لو ضغط "الجولة الجاية" بسرعة
  if(alive().length<=endAt())return endSession();
  S.pot=0;
  S.epoch=(S.epoch||0)+1;
  S.handNo++;
  pileClear();S.boss=-1;S.revealed=new Set();S.log=[];S.revisions=0;window._sp=null;
  const d=deck();
  for(const p of S.players){
    p.bet=0;p.folded=p.out;p.acted=false;p.note="";p.resp=null;p.share=0;p.askOut=false;p._k=null;p.hand=[];
    if(!p.out){p.hand=d.splice(0,4);p.eval=ev(p.hand);}
  }
  do{S.dealer=(S.dealer+1)%S.n;}while(S.players[S.dealer].out);
  say(`الجولة ${S.handNo} — ${S.players[S.dealer].name} لخبط الورق`,"hi");
  S.order=[];let k=S.dealer;
  for(let c=0;c<S.n;c++){k=(k+1)%S.n;if(!S.players[k].out)S.order.push(k);}
  S.turn=0;S.phase="betting";
  if(S.order.length)say(`يبدأ ${S.players[S.order[0]].name} — أول واحد بعد الموزّع`);
  sfx("deal");
  advance();
}
const highBet=()=>Math.max(0,...S.players.map(p=>p.bet));

/* ---- المراهنة ---- */
function advance(){
  if(S.phase!=="betting")return;
  if(S.turn>=S.order.length)return endBetting();
  const p=S.players[S.order[S.turn]];
  if(p.folded){S.turn++;return advance();}
  setViewer(p.i);
  if(p.bot){render();S.busy=true;later(()=>{botBet(p);S.busy=false;S.turn++;advance();},800);}
  else{S.gate=(S.mode==="pass");render();}
}
/* المراهنة رقم معلن فقط — ما ينقص من المحفظة شي إلا عند التسوية آخر الجولة */
function bet(p,amt){
  if(S.phase!=="betting"||p.folded||p.out)return;
  amt=Math.min(amt,p.chips);
  p.bet=amt;p.acted=true;
  const allin=amt>=p.chips;
  p.note=allin?`أول-إن ${fmt(amt)}`:`راهن ${fmt(amt)}`;
  say(`${p.name} ${allin?"نزل أول-إن بـ":"راهن"} ${fmt(amt)}`);
  S.pot=Math.max(0,...S.players.map(x=>x.bet));
  fly(p.i,fmt(amt),"chip");
  sfx("chip");
  pileAdd();
  bump();
}
function fold(p){p.folded=true;p.acted=true;p.note="انسحب";say(`${p.name} انسحب`);fly(p.i,"انسحب","out");sfx("fold");pileAdd();}
function botBet(p){
  const opp=Math.max(1,live().length-1),st=strength(p,opp);
  const hb=highBet(),min=hb+STEP;
  const bluff=Math.random()<(S.diff==="hard"?.26:S.diff==="mid"?.10:.03);
  if(p.chips<min){                       // ما يقدر يزيد: إما أول-إن أو انسحاب
    if(st.win>.5||bluff){p._bluff=bluff&&st.win<=.5;return bet(p,p.chips);}
    return fold(p);
  }
  let amt;
  if(st.win>.58)amt=min+STEP*(1+((Math.random()*3)|0));
  else if(st.win>.32)amt=min;
  else if(bluff){amt=min+STEP*((Math.random()*3)|0);p._bluff=true;}
  else return fold(p);
  bet(p,Math.min(amt,Math.floor(p.chips/STEP)*STEP||p.chips));
}
function endBetting(){
  if(S.phase!=="betting")return;        // حارس ضد التكرار
  S.phase="resolving";
  const b=bettors();
  if(b.length===0){say("الكل انسحب — إعادة توزيع","hi");return later(startHand,1300);}
  if(b.length===1){S.pot=b[0].bet;say(`${b[0].name} راهن لحاله — فاز بالجولة بدون كشف، وما تحرّكت فلوس`,"hi");return finishRound();}
  let boss=b[0];for(const p of b)if(p.bet>boss.bet)boss=p;
  S.boss=boss.i;
  say(`${boss.name} أخذ المايك بمراهنة ${fmt(boss.bet)}`,"hi");
  S.pot=boss.bet;
  say(`التقسيمة على ${fmt(boss.bet)} — مراهنة المايك`);
  S.phase="mic";setViewer(boss.i);S.gate=(S.mode==="pass");
  render();
  if(boss.bot)later(()=>botMic(boss),1000);
}

/* ---- المايك وعرض التقسيم ---- */
/* ميل البوت للمداقشة: كل ما صعّبت، داقش أكثر وأذكى.
   th = أدنى احتمال فوز يفكّر عنده · chance = حتى لو توفّر الشرط، ما يداقش إلا بهذي النسبة
   evK = كم لازم يكون الداقش أربح من العرض عشان يرفضه · acc = ميله لقبول العرض */
const DAG={ easy:{th:.88, chance:.18, evK:3.2, acc:.45},
            mid :{th:.74, chance:.55, evK:2.0, acc:.80},
            hard:{th:.60, chance:.92, evK:1.4, acc:1.0} };
const dag=()=>DAG[S.diff]||DAG.mid;

function botMic(boss){
  const st=strength(boss,others().length);
  const d=dag();
  if(st.win>d.th&&!boss._bluff&&Math.random()<d.chance)return dagesh(boss.i);
  const list=bettors(),k=list.length;
  const base=Math.floor(split()/k/STEP)*STEP;
  const shares={};let used=0;
  for(const p of list)if(p.i!==boss.i){
    let s=Math.round(base*(0.65+0.55*(1-st.win))/STEP)*STEP;
    s=Math.max(0,Math.min(s,split()-used));shares[p.i]=s;used+=s;
  }
  shares[boss.i]=split()-used;
  proposeSplit(boss,shares);
}
function proposeSplit(boss,shares){
  for(const p of bettors()){p.share=shares[p.i]||0;p.resp=(p.i===boss.i)?"ok":null;}
  S.phase="offer";
  say(`${boss.name} عرض تقسيم: ${bettors().map(p=>`${p.name} ${fmt(p.share)}`).join(" · ")}`,"hi");
  runResponses();
}
function runResponses(){
  if(S.phase!=="offer")return;
  const pending=others().filter(p=>p.resp===null);
  if(pending.length===0)return settleOffer();
  const p=pending[0];setViewer(p.i);
  if(p.bot){render();S.busy=true;later(()=>{botRespond(p);S.busy=false;runResponses();},750);}
  else{S.gate=(S.mode==="pass");render();}
}
function botRespond(p){
  const st=strength(p,Math.max(1,bettors().length-1)),d=dag();
  const evD=p.bet*(2*st.win-1);                 // ربح متوقّع من الداقش
  if((st.win>d.th||evD>p.share*d.evK)&&Math.random()<d.chance){
    p.resp="dagesh";say(`${p.name} داقش`,"dg");return;
  }
  if(p.share>=evD*d.acc||S.revisions>=2){p.resp="ok";p.note="وافق";say(`${p.name} وافق على ${fmt(p.share)}`);return;}
  p.resp="no";p.note="رفض";say(`${p.name} رفض ويبي أكثر`);
}
function settleOffer(){
  if(S.phase!=="offer")return;          // حارس: ممنوع تتنفّذ مرتين لنفس العرض
  S.phase="settling";
  const list=bettors();
  if(list.some(p=>p.resp==="dagesh")){S.phase="offer";return dagesh(S.boss);}
  if(list.every(p=>p.resp==="ok")){
    say("الكل وافق على التقسيم — ما انكشفت ولا ورقة","hi");
    /* التقسيمة توزيع جوائز: كل واحد ياخذ حصته، والمايك ياخذ الباقي. محد يدفع. */
    for(const p of list) if(p.share>0){
      p.chips+=p.share;
      say(`${p.name} أخذ ${fmt(p.share)}${p.i===S.boss?" (الباقي)":""}`,p.i===S.boss?"hi":"");
    }
    return finishRound();
  }
  // فيه رفض: المايك يعيد العرض أو يداقش
  S.revisions++;S.phase="mic";window._sp=null;
  const boss=S.players[S.boss];setViewer(boss.i);
  say(`فيه من رفض — المايك يعيد العرض أو يداقش`);
  for(const p of others())p.resp=null;
  S.gate=(S.mode==="pass"&&!boss.bot);
  render();
  if(boss.bot)later(()=>{
    if(S.revisions>2)return dagesh(boss.i);
    const st=strength(boss,others().length);
    if(st.win>.5)return dagesh(boss.i);
    const list2=bettors(),shares={};let used=0;
    for(const p of list2)if(p.i!==boss.i){
      const s=Math.min(split()-used,Math.round(p.share*1.5/STEP)*STEP);shares[p.i]=s;used+=s;}
    shares[boss.i]=split()-used;
    if(shares[boss.i]<0)return dagesh(boss.i);
    proposeSplit(boss,shares);
  },1000);
}

/* ---- طلب الانسحاب بإذن المايك ---- */
function requestOut(p){
  p.askOut=true;say(`${p.name} طلب إذن الانسحاب من ${S.players[S.boss].name}`);
  const boss=S.players[S.boss];
  if(boss.bot){later(()=>{
    const ok=Math.random()<.75;
    if(ok){say(`${boss.name} سمح له`);p.folded=true;p.resp="ok";p.share=0;p.note="انسحب بإذن";}
    else{say(`${boss.name} رفض — لازم يكمل`);p.note="رُفض انسحابه";}
    p.askOut=false;render();runResponses();},900);}
  else render();
}
function answerOut(p,ok){
  p.askOut=false;
  if(ok){p.folded=true;p.resp="ok";p.share=0;p.note="انسحب بإذن";say(`سمحت لـ ${p.name} ينسحب`);}
  else{p.note="رُفض انسحابه";say(`رفضت انسحاب ${p.name}`);}
  render();runResponses();
}

/* ---- الداقش ---- */
function dagesh(byIdx){
  if(S.phase==="showdown"||S.phase==="done"||S.phase==="over")return;   // حارس ضد التكرار
  S.phase="showdown";
  say(`داقش — الكل مجبر يقلب ورقه`,"dg");
  const list=bettors();
  for(const p of list)S.revealed.add(p.i);
  let best=list[0];for(const p of list)if(cmp(p.eval,best.eval)>0)best=p;
  const win=list.filter(p=>cmp(p.eval,best.eval)===0);
  render();
  later(()=>award(win,false,list),500);
}
/* كل لاعب في الكشف يربح مبلغ مراهنته لو فاز، أو يخسره لو انهزم */
function award(winners,hidden,shown){
  const list=shown||winners;
  if(!isOnline()||!isSpec()){
    const meIn=list.find(x=>x.i===(S?S.viewer:0));
    if(meIn) sfx(winners.includes(meIn)?"win":"lose");
  }
  for(const p of list){
    if(winners.includes(p)){ p.chips+=p.bet; if(p.bet>0)say(`${p.name} ربح ${fmt(p.bet)}`,"hi"); }
    else { p.chips-=p.bet; if(p.bet>0)say(`${p.name} خسر ${fmt(p.bet)}`); }
  }
  say(winners.length>1?`تعادل بين ${winners.map(w=>w.name).join(" و ")}`
                      :`${winners[0].name} فاز بالجولة`,"hi");
  finishRound(hidden?null:{shown,winners});
}
function finishRound(reveal){
  if(S.phase==="done"||S.phase==="over")return;     // حارس ضد التكرار
  S.pot=0;
  for(const p of S.players)if(!p.out&&p.chips<=0){p.out=true;say(`${p.name} خرج من الجلسة`);}
  S.phase="done";S.gate=false;if(S.mode==="bots")S.viewer=0;
  render();
  const champ=alive().find(p=>p.chips>=goal());
  if(reveal){
    const over=!!champ||alive().length<=endAt();
    if(isOnline()&&isHost()){
      const slim=a=>a.map(x=>({name:x.name,hand:x.hand,eval:x.eval,bet:x.bet,i:x.i}));
      broadcast({t:"reveal",shown:slim(reveal.shown),winners:slim(reveal.winners),over});
    }
    revealSheet(reveal.shown,reveal.winners,over);
  }
  else if(champ||alive().length<=endAt())later(()=>endSession(champ),900);
}
function endSession(champ){
  const left=alive().sort((a,b)=>b.chips-a.chips);
  const best=champ||left[0]||S.players[0];
  S.phase="over";
  const why = champ ? `وصل هدف ${fmt(goal())}`
            : left.length<=endAt() ? `بقي ${endAt()} لاعبين — الأعلى رصيداً يفوز` : "";
  const standings=S.players.slice().sort((a,b)=>b.chips-a.chips)
                   .map(p=>({name:p.name,chips:p.chips}));
  const win={name:best.name,chips:best.chips,seat:best.i};
  if(isOnline()&&isHost())broadcast({t:"over",win,standings,why,party:!!champ});
  endScreen(win,standings,why,!!champ);
}

/* شاشة النهاية — يشوفها الكل، ومع الفوز بالهدف تصير حفلة */
function endScreen(win,standings,why,party){
  const mine = isOnline() ? (NET && NET.seat===win.seat) : (win.seat===0);
  if(party){ fireworks(6000); sfx("party"); }
  ovShow(`<div class="endwrap ${party?"party":""}">
    ${party?`<div class="crown">🎉</div>`:""}
    <div class="hero sm"><h2>${party?`فاز ${esc(win.name)}!`:"انتهت الجلسة"}</h2>
      <p>${party?`وصل <b>${fmt(win.chips)}</b> وخلّص الجلسة.${mine?" وهذا انت — مبروك!":""}`
                :`<b>${esc(win.name)}</b> فاز بـ ${fmt(win.chips)}${why?" — "+why:""}.`}</p></div>
    <div class="rows" style="margin:14px 0">${standings.map((p,k)=>
      `<div class="row ${k===0?"top":""}"><span>${k===0?"🏆 ":""}${esc(p.name)}</span>
       <b>${fmt(p.chips)}</b></div>`).join("")}</div>
    <div class="ctl"><button class="act b-brass" onclick="stopFireworks();${isOnline()?"leaveRoom()":"setup()"}">جلسة جديدة</button></div>
  </div>`);
}

/* ================= الصوت =================
   ملفات صوت حقيقية من Kenney (رخصة CC0) — ورق ينرمى، فيش، وجنقل فوز.
   تنحمّل مرة وحدة أول ما يلمس اللاعب الشاشة، وتنعزف من الذاكرة عشان ما يصير تأخير. */
const SFXDIR="sfx/";
const SFXFILES=["card1","card2","card3","card4","slide1","slide2","slide3","slide4",
  "fold1","fold2","shuffle","fan","chip1","chip2","chip3","chipsWin","chipsHit",
  "boom1","boom2","boomLow","win","win2","lose","party","turn"];
let AC=null, BUF=Object.create(null), SFXASKED=false, MG=null;

/* ثلاث درجات: هادي (الافتراضي)، عادي، صامت */
const VOLS=[{k:"soft",g:.32,ic:"🔉"},{k:"loud",g:.62,ic:"🔊"},{k:"off",g:0,ic:"🔇"}];
let VOLI=(()=>{ try{ const v=localStorage.getItem("dagesh-vol");
    if(v!==null){const i=+v; if(i>=0&&i<VOLS.length)return i;}
    if(localStorage.getItem("dagesh-mute")==="1")return 2;
  }catch(e){} return 0; })();
let MUTED=VOLS[VOLI].g===0;

function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==="suspended")AC.resume(); return AC; }

/* كل الأصوات تمر من هنا. الفلتر المنخفض يشيل الحدّة اللي تعوّر الأذن
   من تسجيلات قصيرة زي الورق والفيش، والعالي يشيل الطنين المكتوم. */
function bus(){
  const c=ac(); if(!c)return null;
  if(!MG){
    MG=c.createGain();
    const lp=c.createBiquadFilter(); lp.type="lowpass";  lp.frequency.value=4600; lp.Q.value=.55;
    const hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=120;  hp.Q.value=.7;
    MG.connect(lp); lp.connect(hp); hp.connect(c.destination);
  }
  MG.gain.value=VOLS[VOLI].g;
  return MG;
}

function sfxLoad(){
  if(SFXASKED)return; SFXASKED=true;
  const c=ac(); if(!c)return;
  SFXFILES.forEach(n=>{
    fetch(SFXDIR+n+".mp3")
      .then(r=>r.ok?r.arrayBuffer():Promise.reject(0))
      .then(b=>new Promise((ok,no)=>c.decodeAudioData(b,ok,no)))
      .then(x=>{BUF[n]=x;}).catch(()=>{});
  });
}
/* المتصفح ما يسمح بصوت قبل أول لمسة — نجهّز عندها */
["pointerdown","touchstart","keydown"].forEach(ev=>
  addEventListener(ev,()=>{ac();sfxLoad();},{once:true,passive:true}));

const pickOne=a=>a[(Math.random()*a.length)|0];
const vary=()=>0.94+Math.random()*0.13;          // فرق بسيط بالنبرة عشان ما تتكرر نفس الصوت

function play(name,vol,at,rate){
  if(MUTED)return;
  const c=ac(), out=bus(); if(!c||!out)return;
  const b=BUF[name]; if(!b)return;               // لسه ما وصل الملف — نتجاهل بهدوء
  try{
    const src=c.createBufferSource(); src.buffer=b;
    src.playbackRate.value=rate||1;
    const g=c.createGain();
    const t=c.currentTime+(at||0), v=(vol==null?.3:vol);
    /* صعود بسيط 8 ملّي — يكسر الطقّة الحادة في أول الصوت */
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v,t+0.008);
    src.connect(g); g.connect(out);
    src.start(t);
  }catch(e){}
}

/* دفقة ضجيج مفلتر — باقية لصفير الصاروخ بس، لأن ما فيه تسجيل مناسب له */
function nz(o){
  const c=ac(), out=bus(); if(!c||!out||MUTED)return;
  const dur=o.dur, n=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  const sh=o.shape||3;
  for(let k=0;k<n;k++){ const t=k/n; d[k]=(Math.random()*2-1)*Math.pow(1-t,sh); }
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type=o.type||"bandpass";
  const t0=c.currentTime+(o.at||0);
  f.frequency.setValueAtTime(o.f,t0);
  if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t0+dur);
  f.Q.value=o.q||1;
  const g=c.createGain(); g.gain.value=o.vol;
  src.connect(f);f.connect(g);g.connect(out);
  src.start(t0); src.stop(t0+dur+0.02);
}

function sCard(v,at){ play(pickOne(["card1","card2","card3","card4"]),.22*(v||1),at||0,vary()); }
function sSlide(v,at){ play(pickOne(["slide1","slide2","slide3","slide4"]),.16*(v||1),at||0,vary()); }
function sChip(at){ play(pickOne(["chip1","chip2","chip3"]),.22,at||0,vary()); }

function sfx(kind){
  if(MUTED)return;
  try{
    switch(kind){
      case "deal":   play("fan",.15,0,1);
                     for(let k=0;k<4;k++)sCard(.5,.2+k*.13); break;
      case "card":   sCard(1); break;
      case "shuffle":play("shuffle",.15); break;
      case "chip":   sChip(0); break;
      case "fold":   play(pickOne(["fold1","fold2"]),.18,0,vary()); break;
      case "turn":   play("turn",.12); break;
      case "dagesh": sCard(1,0); sCard(1,.085); sCard(1,.17);
                     play("chipsHit",.18,.26); break;
      case "win":    play(pickOne(["win","win2"]),.30);
                     play("chipsWin",.17,.14); break;
      case "lose":   play("lose",.19); break;
      case "msg":    play("turn",.07,0,1.25); break;
      case "rocket": nz({dur:.55,vol:.035,f:280,to:2600,q:3.2,shape:.9}); break;
      case "boom":   play(pickOne(["boom1","boom2","boomLow"]),.22,0,vary()); break;
      case "party":  play("party",.34);

let FW=null;
function stopFireworks(){ if(FW){cancelAnimationFrame(FW.raf);FW.cv.remove();FW=null;} }
function fireworks(ms){
  stopFireworks();
  const cv=document.createElement("canvas");
  cv.className="fw"; document.body.appendChild(cv);
  const g=cv.getContext("2d");
  const fit=()=>{cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
                 g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);};
  fit(); addEventListener("resize",fit);
  const P=[], R=[], t0=performance.now();
  const COL=["#E06A75","#D8A64E","#4FC08C","#EEF1EF","#8ECBE8","#C58BE0"];
  const launch=()=>{
    const x=innerWidth*(0.15+Math.random()*0.7);
    R.push({x,y:innerHeight+10,vy:-(7+Math.random()*4),
            ty:innerHeight*(0.18+Math.random()*0.32),col:COL[(Math.random()*COL.length)|0]});
    sfx("rocket");
  };
  const burst=(x,y,col)=>{
    sfx("boom");
    const n=46+((Math.random()*26)|0);
    for(let k=0;k<n;k++){
      const a=(k/n)*Math.PI*2+Math.random()*.3, sp=1.6+Math.random()*4.2;
      P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,
              col:Math.random()<.25?"#fff":col,sz:1.6+Math.random()*2.2});
    }
  };
  let last=0;
  const step=now=>{
    const el=now-t0;
    if(now-last>430 && el<ms-900){ last=now; launch(); if(Math.random()<.45)setTimeout(launch,140); }
    g.clearRect(0,0,innerWidth,innerHeight);
    for(let k=R.length-1;k>=0;k--){ const r=R[k]; r.y+=r.vy; r.vy+=0.08;
      g.globalAlpha=1; g.fillStyle=r.col; g.beginPath(); g.arc(r.x,r.y,2.4,0,7); g.fill();
      g.globalAlpha=.35; g.fillRect(r.x-1,r.y,2,12);
      if(r.vy>=-1.2||r.y<=r.ty){ burst(r.x,r.y,r.col); R.splice(k,1); } }
    for(let k=P.length-1;k>=0;k--){ const q=P[k];
      q.x+=q.vx; q.y+=q.vy; q.vy+=0.055; q.vx*=0.985; q.vy*=0.985; q.life-=0.011;
      if(q.life<=0){P.splice(k,1);continue;}
      g.globalAlpha=Math.max(0,q.life); g.fillStyle=q.col;
      g.beginPath(); g.arc(q.x,q.y,q.sz,0,7); g.fill(); }
    g.globalAlpha=1;
    if(el<ms||P.length) FW.raf=requestAnimationFrame(step); else stopFireworks();
  };
  FW={cv,raf:requestAnimationFrame(step)};
}

function cardSVG(c,small){
  const red=RED.has(c.s), sd=SUIT_D[c.s];
  if(small) return `<svg class="face-svg ${red?"red":""}" viewBox="0 0 100 140" aria-hidden="true">
     <text class="idx big" x="50" y="52">${c.r}</text>${pip(sd,50,102,0.30)}</svg>`;

  let body;
  if(c.r==="A"){
    body=pip(sd,50,70,0.50);
  }else if(PIPS[c.r]){
    body=PIPS[c.r].map(([x,y])=>pip(sd,x,y,0.185,y>70)).join("");
  }else{                                     // J / Q / K
    body=`<rect class="panel" x="16" y="12" width="68" height="116" rx="4"/>
          <rect class="panel" x="19.5" y="15.5" width="61" height="109" rx="3"/>
          <path class="panel" d="M19.5 70 L80.5 70"/>`
        + courtHalf(c.r,sd)
        + `<g transform="rotate(180 50 70)">${courtHalf(c.r,sd)}</g>`;
  }
  const idx=(x,y,flip)=>`<g transform="translate(${x} ${y}) rotate(${flip?180:0})">
      <text class="idx" x="0" y="0">${c.r}</text>${pip(sd,0,c.r==="10"?13:12,0.085)}</g>`;
  return `<svg class="face-svg ${red?"red":""}" viewBox="0 0 100 140" aria-hidden="true">
    ${body}${idx(10,19)}${idx(90,121,true)}</svg>`;
}

function actions(){
  const bar=$("actions"),v=S.players[S.viewer];
  if(isSpec()){
    bar.innerHTML=`<div class="prompt spec-note"><b>انت متفرّج.</b>

  setTimeout(()=>{const r=$("rg"); if(r)rgSync(r);},0);
  /* الداقش شغّال دايماً لأي لاعب داخل الجولة، حتى لو مو دوره */
  const canDagesh = (S.phase==="mic"||S.phase==="offer") && v.bet>0 && !v.folded && !v.out && !S.revealed.has(v.i);
  const alwaysDagesh = canDagesh
    ? `<div class="always-dagesh"><button class="act b-pom" onclick="askDagesh('dagesh-any')">داقش الآن — اكشف الورق</button>
       <span>تقدر تداقش في أي لحظة، حتى لو مو دورك</span></div>` : "";
  const H=(p,c)=>bar.innerHTML=`<div class="prompt">${p}</div><div class="ctl">${c}</div>${alwaysDagesh}`;

  if(S.phase==="done"||S.phase==="over")
    return H("الجولة خلصت.",`<button class="act b-brass" onclick="act('next')">الجولة الجاية</button>`);

  // طلبات انسحاب معلّقة عندك كصاحب مايك
  if(S.boss===S.viewer){
    const req=bettors().find(p=>p.askOut);
    if(req)return H(`<b>${req.name}</b> يطلب إذنك ينسحب من الجولة. لك ترفض وتجبره يكمل.`,
      `<button class="act b-quiet" onclick="act('answerout',{target:${req.i},ok:true})">أسمح له</button>
       <button class="act b-pom" onclick="act('answerout',{target:${req.i},ok:false})">أرفض</button>`);
  }
  // دورك في المراهنة
  if(S.phase==="betting"&&S.order[S.turn]===S.viewer&&!v.folded&&!v.bot){
    const hb=highBet(),min=hb+STEP;
    if(v.chips<min)
      return H(`أعلى مراهنة الحين <b>${fmt(hb)}</b> وما عندك أكثر منها. إما تنزل <b>أول-إن</b> بكل رصيدك أو تنسحب.`,
        `<button class="act b-brass" onclick="act('bet',{amount:${v.chips}})">أول-إن ${fmt(v.chips)}</button>
         <button class="act b-quiet" onclick="act('fold')">انسحب</button>`);
    const max=Math.floor(v.chips/STEP)*STEP;
    return H(`دورك. ${hb?`أعلى مراهنة <b>${fmt(hb)}</b>، لازم تزيد 5,000 على الأقل.`:`ابدأ المراهنة، الحد الأدنى <b>5,000</b>.`}`,
      `<div class="amt">
         <input type="range" id="rg" min="${min}" max="${max}" step="${STEP}" value="${min}"
                aria-label="مبلغ المراهنة"
                oninput="rgSync(this)">
         <span class="amtval num" id="og">${fmt(min)}</span>
       </div>
       <button class="act b-brass" onclick="act('bet',{amount:+document.getElementById('rg').value})">راهن</button>
       <button class="act b-quiet" onclick="act('fold')">انسحب</button>`);
  }
  // انت صاحب المايك
  if(S.phase==="mic"&&S.boss===S.viewer&&!v.bot){
    const list=bettors();
    if(!window._sp||window._spPot!==split()||window._spN!==list.length){
      window._sp={};window._spPot=split();window._spN=list.length;
      const b=Math.floor(split()/list.length/STEP)*STEP;let u=0;
      for(const p of list)if(p.i!==S.viewer){window._sp[p.i]=b;u+=b;}
    }
    const used=Object.values(window._sp).reduce((a,b)=>a+b,0),mine=split()-used;
    const rows=list.filter(p=>p.i!==S.viewer).map(p=>`<div class="sp-row">
      <span class="nm">${p.name}</span>
      <button class="stp" onclick="spAdj(${p.i},-1)">−</button>
      <span class="val num">${fmt(window._sp[p.i]||0)}</span>
      <button class="stp" onclick="spAdj(${p.i},1)">+</button></div>`).join("");
    return H(`تقسيمتك <b>${fmt(split())}</b> — وهي مراهنتك، وتدفعها من محفظتك للي يوافق. وزّع زي ما تبي — تقدر تعطي واحد أكثر عشان يوافق. لو وافقوا كلهم، ما ينكشف ورق أحد.`,
      `<div class="split">${rows}
        <div class="sp-row" style="border-top:1px solid var(--line);padding-top:7px">
          <span class="nm">حصتك</span><span class="val num">${fmt(mine)}</span></div>
        <div class="left ${mine<0?"bad":""}">${mine<0?"التوزيع تعدّى القدر":"المجموع لازم يساوي القدر"}</div></div>
       <button class="act b-brass" ${mine<0?"disabled":""} onclick="uOffer()">اعرض التقسيم</button>
       <button class="act b-pom" onclick="askDagesh('mic-dagesh')">داقش</button>`);
  }
  // ردّك على العرض
  if(S.phase==="offer"&&S.viewer!==S.boss&&v.resp===null&&!v.bot&&!v.folded){
    return H(`${S.players[S.boss].name} عارض عليك <b>${fmt(v.share)}</b>. لو وافقت تدخل محفظتك على طول. ولو داقشت وكسبت تاخذ مراهنتك <b>${fmt(v.bet)}</b>، ولو خسرت تروح عليك.`,
      `<button class="act b-brass" onclick="act('resp',{r:'ok'})">أوافق ${fmt(v.share)}</button>
       <button class="act b-quiet" onclick="act('resp',{r:'no'})">أبي أكثر</button>
       <button class="act b-quiet" style="flex:0 0 100%" onclick="act('askout')">اطلب إذن الانسحاب</button>`);
  }
  H(S.busy?"في انتظار بقية اللاعبين…":"…","");
}

/* ---- أفعال اللاعب ---- */
function uBet(a){bet(S.players[S.viewer],a);S.turn++;advance();}
function uFold(){fold(S.players[S.viewer]);S.turn++;advance();}
/* تعبئة شريط السلايدر + تحديث الرقم */
function rgSync(el){
  const mn=+el.min, mx=+el.max, v=+el.value;
  el.style.setProperty("--fill", (mx>mn?((v-mn)/(mx-mn)*100):0)+"%");
  const o=$("og"); if(o)o.textContent=Number(v).toLocaleString("en-US");
}
function askDagesh(kind){
  const v=S.players[S.viewer];
  ovShow(`<div class="hero sm"><h2>تداقش؟</h2>
    <p>الكل بيقلب ورقه على طول. لو مشروعك الأقوى تربح <b>${fmt(v.bet)}</b>،
       ولو انهزمت تروح عليك.</p></div>
    <div class="ctl">
      <button class="act b-quiet" onclick="ovHide()">لا، رجّعني</button>
      <button class="act b-pom" onclick="ovHide();act('${kind}')">نعم، داقش</button>
    </div>`);
}
function spAdj(i,dir){
  const cur=window._sp[i]||0,used=Object.values(window._sp).reduce((a,b)=>a+b,0);
  const next=cur+dir*STEP;
  if(next<0)return;
  if(dir>0&&used+STEP>split())return;
  window._sp[i]=next;render();
}
function uOffer(){
  const sh={...window._sp};
  sh[S.viewer]=split()-Object.values(window._sp).reduce((a,b)=>a+b,0);
  window._sp=null;act("offer",{shares:sh});
}
function uResp(r){
  const p=S.players[S.viewer];p.resp=r;
  if(r==="dagesh"){say(`${p.name} داقش`,"dg");}
  else if(r==="ok"){p.note="وافق";say(`${p.name} وافق على ${fmt(p.share)}`);}
  else{p.note="رفض";say(`${p.name} رفض ويبي أكثر`);}
  runResponses();
}

let SCROLLY=0;
function lockScroll(on){
  const b=document.body;
  if(on){
    if(b.classList.contains("noscroll"))return;
    SCROLLY=window.scrollY||window.pageYOffset||0;
    b.style.top=(-SCROLLY)+"px"; b.classList.add("noscroll");
  }else{
    if(!b.classList.contains("noscroll"))return;
    b.classList.remove("noscroll"); b.style.top="";
    window.scrollTo(0,SCROLLY);
  }
}
function ovShow(h){ const sh=$("sheet"); sh.innerHTML=h; sh.scrollTop=0;
  $("ov").hidden=false; lockScroll(true); }
function ovHide(){ $("ov").hidden=true; lockScroll(false); }
function revealSheet(shown,winners,over){
  const rows=shown.slice().sort((a,b)=>cmp(b.eval,a.eval)).map(p=>{
    const w=winners.includes(p);

/* ================= اللعب المشترك (P2P عبر WebRTC) =================
   المضيف هو الحَكَم: جهازه يوزّع الورق ويدير الجولة، ويرسل لكل واحد
   نسخة من الحالة ما فيها إلا ورقه هو. الضيوف يرسلون أفعالهم للمضيف.
   كل جهاز له هوية ثابتة (cid) عشان لو طلع ورجع يرجع لنفس مقعده. */
let NET=null;
const CID=(()=>{ let v=null;
  try{v=localStorage.getItem("dagesh-cid")}catch(e){}
  if(!v){ v=Math.random().toString(36).slice(2)+Date.now().toString(36);
          try{localStorage.setItem("dagesh-cid",v)}catch(e){} }
  return v; })();

const mkCode=()=>String(10000+rnd(90000));     // كود رقمي من 5 خانات

/* ================= طبقة النقل =================
   كل الرسائل تمر عبر وسيط MQTT عام. اخترناه بدل الاتصال المباشر
   لأن الاتصال المباشر يفشل كثير على شبكات الجوال، والوسيط القديم
   كان محجوب أصلاً. الوسيط ينقل رسائل فقط وما يفهم اللعبة. */
const BROKERS=[
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://test.mosquitto.org:8081/mqtt"
];
const TOP=c=>({hub:`dagesh26/${c}/hub`, all:`dagesh26/${c}/all`,
               host:`dagesh26/${c}/host`, me:x=>`dagesh26/${c}/p/${x}`});

let TR=null;                                   // {cli, code, t, role}
function trClose(){ try{ TR&&TR.cli&&TR.cli.end(true) }catch(e){} TR=null; }

/* يفتح الاتصال بالوسيط ويجرّب البدائل لو فشل */
function trConnect(code,role,onMsg,onReady,onFail,idx){
  idx=idx||0;
  if(typeof mqtt==="undefined")return onFail("no-lib");
  if(idx>=BROKERS.length)return onFail("no-broker");
  const t=TOP(code);
  const opts={clientId:"dg_"+CID+"_"+Math.random().toString(16).slice(2,8),
              keepalive:25, reconnectPeriod:2500, connectTimeout:9000, clean:true};
  if(role==="host"){                            // لو انقطع المضيف، الوسيط يمسح إعلانه تلقائياً
    opts.will={topic:t.host, payload:"", qos:0, retain:true};
  }
  let cli;
  try{ cli=mqtt.connect(BROKERS[idx],opts); }catch(e){ return trConnect(code,role,onMsg,onReady,onFail,idx+1); }
  let settled=false;
  const fail=why=>{ if(settled)return; settled=true;
    try{cli.end(true)}catch(e){}
    trConnect(code,role,onMsg,onReady,onFail,idx+1); };
  const timer=setTimeout(()=>fail("timeout"),10000);
  cli.on("connect",()=>{
    if(settled)return; settled=true; clearTimeout(timer);
    TR={cli,code,t,role};
    const subs=role==="host"?[t.hub,t.host]:[t.all,t.me(CID),t.host];
    cli.subscribe(subs,{qos:0},()=>onReady(t));
  });
  cli.on("error",()=>fail("error"));
  cli.on("close",()=>{ if(!settled)fail("close"); });
  cli.on("message",(topic,buf)=>{
    let d=null; const raw=buf.toString();
    if(topic===t.host){ onMsg("__host__",raw?JSON.parse(raw):null); return; }
    try{ d=JSON.parse(raw) }catch(e){ return; }
    if(!d||d.from===CID)return;                 // ما نستقبل رسائلنا
    onMsg(topic,d);
  });
}
function trConnectAt(idx,code,role,onMsg,onReady,onFail){
  trConnect(code,role,onMsg,onReady,onFail,idx||0);
}
function trPub(topic,obj,retain){
  if(!TR)return;
  try{ TR.cli.publish(topic,JSON.stringify(Object.assign({from:CID},obj)),{qos:0,retain:!!retain}); }catch(e){}
}
function trBroadcast(obj){ TR&&trPub(TR.t.all,obj); }
function trToHost(obj){    TR&&trPub(TR.t.hub,obj); }
function trToPeer(cid,obj){TR&&trPub(TR.t.me(cid),obj); }
function trAnnounceHost(on,name){
  if(!TR)return;
  if(on) TR.cli.publish(TR.t.host,JSON.stringify({from:CID,name}),{qos:0,retain:true});
  else   TR.cli.publish(TR.t.host,"",{qos:0,retain:true});
}

/* ---------- دليل الغرف المفتوحة ----------
   المضيف اللي يخلي غرفته عامة ينشر بطاقة صغيرة على موضوع ثابت،
   والوسيط يحتفظ فيها ويعطيها لأي واحد يشترك. ما فيه سيرفر ولا قاعدة بيانات:
   البطاقة تتجدّد كل 20 ثانية، وتنمسح لما تبدأ اللعبة أو يطلع المضيف. */
const LOBTOP="dagesh26/lobby/";
let LOBBEAT=null;
function lobbyPublish(on){
  if(!TR||!NET||!NET.isHost)return;
  const t=LOBTOP+NET.code;
  if(on&&NET.pub&&!(S&&S.phase)){
    const ps=players_().length, bots=Math.min(NET.bots||0,13-ps);
    TR.cli.publish(t,JSON.stringify({code:NET.code,host:NET.me,n:ps,bots,
      cap:NET.cap,ts:Date.now()}),{qos:0,retain:true});
  }else{
    TR.cli.publish(t,"",{qos:0,retain:true});      // شيلها من القائمة
  }
}
function lobbyBeat(on){
  clearInterval(LOBBEAT); LOBBEAT=null;
  lobbyPublish(on);
  if(on)LOBBEAT=setInterval(()=>lobbyPublish(true),20000);
}

let BRW=null, BRWNAME="", BRWIDX=0;

function browseRooms(name){
  browseClose();
  BRWNAME=name||BRWNAME;
  ovShow(`<div class="hero sm"><h2>غرف مفتوحة</h2>
    <p>غرف ناس ناقصهم لاعبين — ادخل على أي وحدة والعب معهم.</p></div>
   <div class="conn" id="netConn">ندوّر على غرف…</div>
   <div id="brwList"></div>
   <div class="ctl" style="margin-top:14px">
     <button class="act b-quiet" onclick="browseRooms()">حدّث</button>
     <button class="act b-quiet" onclick="browseClose();ovHide();setup()">رجوع</button></div>`);
  if(typeof mqtt==="undefined"){ netStatus("مكتبة الاتصال ما تحمّلت",true); return; }
  const rooms=new Map(); let idx=0;
  const draw=cli=>{
    const now=Date.now(), live=[];
    rooms.forEach((d,code)=>{
      const age=now-(d.ts||0);
      if(age<75000) live.push(d);
      else if(age>600000){ try{cli.publish(LOBTOP+code,"",{qos:0,retain:true})}catch(e){} } // ننضّف الميّت
    });
    live.sort((a,b)=>(b.n+b.bots)-(a.n+a.bots));
    const box=$("brwList"); if(!box)return;
    netStatus(live.length?`${live.length} غرفة مفتوحة`:"ما فيه غرف مفتوحة حالياً");
    box.innerHTML = live.length ? `<div class="lobby-list">`+live.map(d=>{
        const full=d.n>=d.cap;
        return `<div class="brw-row">
          <div class="brw-i"><b>${esc(d.host||"لاعب")}</b>
            <span>رمز ${d.code} · ${d.n} من ${d.cap}${d.bots?` · ${d.bots} بوت`:""}</span></div>
          <button class="act b-brass sm" ${full?"disabled":""}
            onclick="browseJoin('${d.code}')">${full?"ممتلئة":"ادخل"}</button></div>`;
      }).join("")+`</div>`
      : `<div class="warn" style="margin-top:14px">ما فيه أحد فاتح غرفة عامة الحين.
         ارجع وسوِّ غرفة وخلّها <b>عامة</b> — بتبين لأي واحد يفتح الصفحة، وانتظرهم يدخلون.</div>`;
  };
  const start=()=>{
    if(idx>=BROKERS.length){ netStatus("ما قدرنا نتصل بأي وسيط",true); return; }
    let cli;
    try{ cli=mqtt.connect(BROKERS[idx],{clientId:"dgb_"+Math.random().toString(16).slice(2,10),
      keepalive:20,reconnectPeriod:0,connectTimeout:8000,clean:true}); }
    catch(e){ idx++; return start(); }
    BRW=cli; let ok=false;
    const to=setTimeout(()=>{ if(!ok){ try{cli.end(true)}catch(e){} idx++; start(); } },8500);
    cli.on("connect",()=>{ ok=true; clearTimeout(to); BRWIDX=idx;
      cli.subscribe(LOBTOP+"+",{qos:0},()=>setTimeout(()=>draw(cli),2200)); });
    cli.on("error",()=>{ if(!ok){ clearTimeout(to); try{cli.end(true)}catch(e){} idx++; start(); } });
    cli.on("message",(t,buf)=>{
      const code=t.slice(LOBTOP.length), raw=buf.toString();
      if(!raw){ rooms.delete(code); return; }
      try{ const d=JSON.parse(raw); if(d&&d.code)rooms.set(d.code,d); }catch(e){}
    });
  };
  start();
}

let WAKE=null;
async function keepAwake(on){

}

/* ---------- قائمة الحاضرين (عند المضيف) ---------- */
const players_=()=>NET.roster.filter(r=>r.role==="player").sort((a,b)=>a.seat-b.seat);
const specs_  =()=>NET.roster.filter(r=>r.role==="spec");
const findCid =c=>NET.roster.find(r=>r.cid===c);
function freeSeat(){
  const used=new Set(players_().map(r=>r.seat));
  for(let k=0;k<NET.cap;k++) if(!used.has(k)) return k;
  return -1;
}
function sendTo(r,msg){ if(r&&r.cid&&r.cid!==CID) trToPeer(r.cid,msg); }
function broadcast(msg){ trBroadcast(msg); }

function rosterMsg(){
  const bots=(S&&S.phase&&NET.botSeats!=null)
    ? S.players.slice(NET.botSeats).map(p=>({cid:"bot"+p.i,name:p.name,seat:p.i,online:true,bot:true}))
    : [];
  return {t:"roster",
    players:players_().map(r=>({cid:r.cid,name:r.name,seat:r.seat,online:r.online})).concat(bots),
    specs:specs_().map(r=>({cid:r.cid,name:r.name,online:r.online})),
    cap:NET.cap, started:!!(S&&S.phase)};
}
function pushRoster(){ if(!isHost())return; broadcast(rosterMsg());
  if(!S||!S.phase){ lobbyPublish(true); lobbyHost(); } }

function stateFor(seat){
  const spec=seat==null||seat<0;
  return {n:S.n,phase:S.phase,pot:S.pot,boss:S.boss,turn:S.turn,order:S.order,
    dealer:S.dealer,handNo:S.handNo,log:S.log,revisions:S.revisions,
    revealed:[...S.revealed],yourSeat:spec?-1:seat,spectator:spec,
    players:S.players.map(p=>({i:p.i,name:p.name,chips:p.chips,bet:p.bet,folded:p.folded,
      out:p.out,note:p.note,resp:p.resp,share:p.share,askOut:p.askOut,
      hand:(!spec&&p.i===seat)||S.revealed.has(p.i)?p.hand:[],
      eval:(!spec&&p.i===seat)||S.revealed.has(p.i)?p.eval:null}))};
}
function pushState(){
  if(!isHost()||!S)return;
  for(const r of NET.roster){
    if(r.cid===CID||String(r.cid).startsWith("bot"))continue;
    trToPeer(r.cid,{t:"state",s:stateFor(r.role==="player"?r.seat:-1)});
  }
}
function applyState(st){
  buildRanks(st.n);
  S=Object.assign({},st,{revealed:new Set(st.revealed),
    players:st.players.map(p=>Object.assign({},p,{hand:p.hand||[],bot:false,_k:null})),
    mode:"online",gate:false,viewer:Math.max(0,st.yourSeat),busy:false,diff:"mid",
    spectator:!!st.spectator});
  render();
}

function act(type,payload){
  if(!isOnline())return applyAct(S.viewer,type,payload);
  if(isSpec())return;
  if(isHost())return applyAct(NET.seat,type,payload);
  trToHost({t:"act",type,payload:payload||{}});
}
function applyAct(seat,type,pl){
  pl=pl||{};const p=S.players[seat];if(!p)return;
  switch(type){
    case "bet":  if(S.phase!=="betting"||S.order[S.turn]!==seat)return;
                 bet(p,pl.amount);S.turn++;advance();break;
    case "fold": if(S.phase!=="betting"||S.order[S.turn]!==seat)return;
                 fold(p);S.turn++;advance();break;
    case "offer":if(S.phase!=="mic"||S.boss!==seat)return;proposeSplit(p,pl.shares);break;
    case "mic-dagesh": if(S.phase!=="mic"||S.boss!==seat)return;sfx("dagesh");dagesh(seat);break;
    case "resp": if(S.phase!=="offer"||p.resp!==null)return;
                 p.resp=pl.r;
                 if(pl.r==="dagesh"){sfx("dagesh");say(`${p.name} داقش`,"dg");}
                 else if(pl.r==="ok"){p.note="وافق";say(`${p.name} وافق على ${fmt(p.share)}`);}
                 else{p.note="رفض";say(`${p.name} رفض ويبي أكثر`);}
                 runResponses();break;
    case "askout":   if(S.phase!=="offer"&&S.phase!=="mic")return;requestOut(p);break;
    case "dagesh-any":
                 if(S.phase!=="mic"&&S.phase!=="offer")return;
                 if(!p.bet||p.folded||p.out)return;
                 p.resp="dagesh"; sfx("dagesh"); say(`${p.name} داقش`,"dg");
                 dagesh(seat); break;
    case "answerout":if(S.boss!==seat)return;answerOut(S.players[pl.target],pl.ok);break;
    case "next":     if(S.phase==="done")startHand();break;
  }
  render();
}

  NET.chat=NET.chat||[];

}
function chatSend(){

  const t=(el.value||"").trim(); if(!t)return;

  if(isHost())chatPush(NET.me,t); else trToHost({t:"chat",text:t});
}
function renderChat(){
  const box=$("chatBox"); if(!box||!NET)return;
  /* لو كان اللاعب طالع فوق يقرأ القديم ما نزعجه، وإلا ننزل لآخر رسالة */

}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function kick(cid){
  if(!isHost()||cid===CID)return;
  const r=findCid(cid); if(!r)return;
  trToPeer(cid,{t:"kicked"});
  NET.roster=NET.roster.filter(x=>x.cid!==cid);
  if(S&&S.phase&&r.role==="player"&&S.players[r.seat]){
    S.players[r.seat].out=true; S.players[r.seat].folded=true;
    say(`${r.name} انطرد من الجلسة`);
  }
  pushRoster(); pushState(); if(S)render();
}

function hostOnMsg(topic,d){
  if(!NET||!NET.isHost||!d)return;
  if(topic==="__host__")return;
  const cid=d.from;
  if(d.t==="hello"){
    const nm=(d.name||"لاعب").slice(0,12);
    let r=findCid(cid);
    if(r){ r.online=true; r.name=nm; }
    else{
      const started=!!(S&&S.phase);
      const seat=started?-1:freeSeat();
      const role=(started||seat<0)?"spec":"player";
      r={cid,name:nm,seat,role,online:true};
      NET.roster.push(r);
      say2(`${nm} ${role==="spec"?"دخل متفرّج":"دخل الغرفة"}`);
    }
    trToPeer(cid,{t:"welcome",seat:r.seat,role:r.role,code:NET.code});
    trToPeer(cid,{t:"chat",list:NET.chat||[]});
    if(S&&S.phase)trToPeer(cid,{t:"state",s:stateFor(r.role==="player"?r.seat:-1)});
    pushRoster();
  }
  else if(d.t==="bye"){
    const r=findCid(cid); if(!r)return;
    r.online=false; say2(`${r.name} طلع`); pushRoster(); if(S&&S.phase)render();
  }
  else if(d.t==="act"){ const r=findCid(cid); if(r&&r.role==="player")applyAct(r.seat,d.type,d.payload); }
  else if(d.t==="chat"){ const r=findCid(cid); chatPush(r?r.name:"لاعب",d.text); }
  else if(d.t==="ping"){ const r=findCid(cid); if(r)r.online=true; }
}
/* لو صاحب الدور منقطع، نتصرّف عنه بعد مهلة عشان الجولة ما تتعلّق */
function autoIfOffline(){
  if(!isHost()||!S||!S.phase||S.phase==="done"||S.phase==="over")return;
  const t=whoseTurn(); if(t<0)return;
  if(S.players[t]&&S.players[t].bot){ clearTimeout(S._autoT); S._autoT=null; return; }
  const r=NET.roster.find(x=>x.role==="player"&&x.seat===t);
  if(!r||r.online){ clearTimeout(S._autoT); S._autoT=null; return; }
  if(S._autoFor===t&&S._autoT)return;
  clearTimeout(S._autoT); S._autoFor=t;
  S._autoT=setTimeout(()=>{
    if(!isHost()||!S||whoseTurn()!==t)return;
    const rr=NET.roster.find(x=>x.role==="player"&&x.seat===t);
    if(rr&&rr.online)return;
    const nm=S.players[t]?S.players[t].name:"لاعب";
    if(S.phase==="betting"){ say(`${nm} منقطع — انسحب تلقائياً`); applyAct(t,"fold"); }
    else if(S.phase==="offer"){ say(`${nm} منقطع — وافق تلقائياً`); applyAct(t,"resp",{r:"ok"}); }
    else if(S.phase==="mic"){
      const l=bettors(), q=Math.floor(split()/l.length/STEP)*STEP, sh={}; let u=0;
      l.forEach(x=>{ if(x.i!==t){sh[x.i]=q;u+=q;} }); sh[t]=split()-u;
      say(`${nm} منقطع — قسّمنا بالتساوي عنه`); applyAct(t,"offer",{shares:sh});
    }
  },15000);
}
function say2(t){ if(S&&S.phase){say(t);} }

function joinRoom(name,code,tries,bidx){
  tries=tries||0;
  ovShow(`<div class="hero sm"><h2>جاري الدخول…</h2><p>نتصل بغرفة <b>${code}</b>.</p></div>

  NET={isHost:false,code,me:name,seat:null,role:null,chat:[]};
  NET._bidx=bidx||0;
  trConnectAt(bidx||0,code,"guest",guestOnMsg,()=>{
    netStatus("نبحث عن الغرفة…");
    trToHost({t:"hello",name});
    let n=0;
    const poke=setInterval(()=>{
      if(!NET||NET.seat!==null||!NET.isHost===false){}
      if(!NET||NET.seat!==null){clearInterval(poke);return;}
      if(++n>6){ clearInterval(poke);
        netStatus("ما فيه غرفة بهذا الرمز، أو المضيف مقفل الصفحة",true); return; }
      trToHost({t:"hello",name});
    },2500);
    NET._poke=poke;
  },why=>{
    NET=null;
    ovShow(`<div class="hero sm"><h2>الاتصال ما ضبط</h2>
      <p>${why==="no-lib"?"مكتبة الاتصال ما تحمّلت.":"كل وسطاء الاتصال ما ردّوا. جرّب من شبكة ثانية أو أطفئ الـVPN."}</p></div>
      <div class="ctl"><button class="act b-brass" onclick="ovHide();joinRoom('${esc(name)}','${code}')">حاول مرة ثانية</button>
      <button class="act b-quiet" onclick="ovHide();setup()">رجوع</button></div>`);
  });
}
function guestOnMsg(topic,d){
  if(!NET)return;
  if(topic==="__host__"){                       // إعلان المضيف اختفى = طلع
    if(!d && NET.seat!==null && !NET.closed) hostGone();
    return;
  }
  if(!d)return;
  if(d.t==="welcome"){ clearInterval(NET._poke); NET.seat=d.seat; NET.role=d.role; lobbyGuest(); }
  else if(d.t==="roster"){ NET.lobby=d; if(!S||!S.phase)lobbyGuest(); if(S)render(); }
  else if(d.t==="chat"){ NET.chat=d.list||[]; renderChat(); }
  else if(d.t==="state"){ ovHide(); applyState(d.s); NET.lastState=d.s; saveRoom(); }
  else if(d.t==="kicked"){ NET.closed=true; ovShow(`<div class="hero sm"><h2>انطردت من الغرفة</h2>
      <p>المضيف طلّعك من الجلسة.</p></div>
      <button class="act b-brass wide" onclick="leaveRoom()">رجوع</button>`); }
  else if(d.t==="reveal"){ revealSheet(d.shown,d.winners,d.over); }
  else if(d.t==="over"){ S&&(S.phase="over"); endScreen(d.win,d.standings,d.why,d.party); }
  else if(d.t==="hostleft"){ hostGone(); }
  else if(d.t==="closed"){ NET.closed=true; clearRoom();
      ovShow(`<div class="hero sm"><h2>المضيف أنهى الجلسة</h2><p>الغرفة انتهت بإرادة المضيف.</p></div>
      <button class="act b-brass wide" onclick="leaveRoom()">رجوع للبداية</button>`); }
}

/* ---------- المضيف طلع: واحد منهم يستلم ---------- */
function knownPlayers(){
  const d=NET&&NET.lobby;
  if(d&&d.players&&d.players.length)return d.players.filter(x=>!x.bot).slice().sort((a,b)=>a.seat-b.seat);
  if(NET&&NET.lastState)return NET.lastState.players.map((p,k)=>({cid:null,name:p.name,seat:k,online:true}));
  return [];
}
function hostGone(){
  if(!NET||NET.migrating||NET.closed)return;
  NET.migrating=true;
  const list=knownPlayers().filter(r=>r.seat!==0);
  const rank=Math.max(0,list.findIndex(r=>r.cid===CID));
  ovShow(`<div class="hero sm"><h2>المضيف طلع</h2>
    <p>نحاول نكمّل الجلسة بدونه. أرصدتكم محفوظة، والجولة الحالية تُلغى ونبدأ جولة جديدة.</p></div>
    <div class="conn" id="netConn">${rank===0?"انت اللي بتستلم…":"لحظات…"}</div>
    <div class="ctl" style="margin-top:14px"><button class="act b-quiet" onclick="leaveRoom()">اخرج</button></div>`);
  setTimeout(()=>takeOver(),1000+rank*2500);
}
function takeOver(){
  if(!NET||!NET.migrating)return;
  const code=NET.code, myName=NET.me, snap=NET.lastState, known=knownPlayers();
  trAnnounceHost(true,myName);                  // نعلن نفسنا مضيف
  setTimeout(()=>{                               // نتأكد ما أحد سبقنا
    if(!NET||!NET.migrating)return;
    NET.migrating=false;
    trClose();
    const mySeat=Math.max(0,known.findIndex(r=>r.cid===CID));
    NET={isHost:true,code,me:myName,seat:mySeat,role:"player",cap:Math.max(4,known.length),
         chat:[],bots:0,botDiff:"mid",
         roster:known.map(r=>({cid:r.cid||("?"+r.seat),name:r.name,seat:r.seat,role:"player",
                               online:r.cid===CID}))};
    trConnect(code,"host",hostOnMsg,()=>{
      trAnnounceHost(true,myName); keepAwake(true);
      const names=known.map(r=>r.name);
      newSession(names.length,"online","mid",names);
      if(snap&&snap.players)S.players.forEach((q,k)=>{
        const o=snap.players[k]; if(o){q.chips=o.chips;q.out=o.out;}
      });
      S.players.forEach(q=>q.bot=false);
      S.viewer=mySeat;
      say(`${myName} استلم الاستضافة — الجولة أُلغيت ونبدأ من جديد`,"hi");
      startHand(); pushRoster(); pushState(); render();
    },()=>{ netStatus("ما قدرنا نكمّل — ابدأوا غرفة جديدة",true); });
  },1200);
}
/* ---------- شاشات الغرفة ---------- */
function rosterRows(list,specs,canKick){
  const rows=list.map(r=>`<div class="lobby-p ${r.online?"":"off"} ${r.bot?"bot":""}">
      <span class="dot"></span><span>${esc(r.name)}</span>
      ${r.bot?'<span class="bot-tag">بوت</span>':""}
      ${r.cid===CID?'<span class="me">أنت</span>':""}
      ${r.online?"":'<span class="off-tag">منقطع</span>'}
      ${canKick&&r.cid!==CID&&!r.bot?`<button class="kick" onclick="kick('${r.cid}')" title="اطرده">×</button>`:""}
    </div>`).join("");
  const sp=(specs&&specs.length)?`<div class="spec-head">متفرّجون (${specs.length})</div>`+
    specs.map(r=>`<div class="lobby-p spec"><span class="dot sp"></span><span>${esc(r.name)}</span>
      ${r.cid===CID?'<span class="me">أنت</span>':""}
      ${canKick&&r.cid!==CID?`<button class="kick" onclick="kick('${r.cid}')">×</button>`:""}</div>`).join(""):"";
  return rows+sp;
}
function setPublic(v){ if(!NET||!NET.isHost)return; NET.pub=!!v; lobbyBeat(NET.pub); lobbyHost(); }
function setBots(n){ if(!NET)return; NET.bots=Math.max(0,Math.min(13-players_().length,n)); lobbyHost(); }
function setBotDiff(d){ if(!NET)return; NET.botDiff=d; lobbyHost(); }

function lobbyHost(){
  if(!NET||!NET.roster)return;
  const ps=players_(), sp=specs_();
  const bots=Math.min(NET.bots||0,13-ps.length), total=ps.length+bots;
  const link=location.origin+location.pathname+"?room="+NET.code;
  ovShow(`<div class="hero sm"><h2>غرفة داقش</h2><p>عطِ أصحابك الرمز، أو أرسل لهم الرابط ويدخلون على طول.</p></div>
   <div class="roomcode">${NET.code}</div>
   <div class="lobby-list">${rosterRows(ps,sp,true)}</div>
   <p style="font-size:12.5px;text-align:center;color:var(--ink-3)">
     ${ps.length} من ${NET.cap}${sp.length?` · و${sp.length} متفرّج`:""}</p>

   <div class="botbox">
     <div class="opt"><label>بوتات يلعبون معكم</label><div class="segs tight" id="sB">
       ${Array.from({length:Math.min(10,13-ps.length)+1},(_,k)=>k).map(k=>
         `<button data-v="${k}" aria-pressed="${k===bots}" onclick="setBots(${k})">${k===0?"بدون":k}</button>`).join("")}
     </div></div>
     ${bots>0?`<div class="opt"><label>مستوى البوتات</label><div class="segs" id="sBD">
       ${[["easy","سهل"],["mid","متوسط"],["hard","صعب"]].map(([v,t])=>
         `<button data-v="${v}" aria-pressed="${v===NET.botDiff}" onclick="setBotDiff('${v}')">${t}</button>`).join("")}
     </div></div>`:""}
     <p class="botnote">${total>=4
        ? `الطاولة بتكون <b>${total}</b> لاعبين — ${ps.length} منكم${bots?` و${bots} بوت`:""}.`
        : `تحتاجون <b>4</b> على الطاولة — ناقصكم ${4-total}. زيدوا بوتات أو انتظروا أصحابكم.`}</p>
   </div>

   <div class="pubrow">
     <div><b>${NET.pub?"غرفة عامة":"غرفة خاصة"}</b>
       <span>${NET.pub?"تبين في قائمة الغرف المفتوحة، وأي أحد يقدر يدخل."
                     :"ما تبين لأحد — بس اللي عنده الرمز يدخل."}</span></div>
     <button class="act b-quiet sm" onclick="setPublic(${NET.pub?0:1})">
       ${NET.pub?"خلّها خاصة":"خلّها عامة"}</button>
   </div>

   <div class="ctl"><button class="act b-brass" ${total<4?"disabled":""} onclick="startOnline()">
       ابدأ اللعب${total>=4?` (${total})`:""}</button>
   <button class="act b-quiet" onclick="copyLink(this,'${link}')">انسخ الرابط</button></div>
   <div class="ctl"><button class="act b-quiet" onclick="leaveRoom()">إلغاء الغرفة ورجوع</button></div>
   <div class="warn"><b>خلّ الصفحة مفتوحة</b> وشاشتك صاحية طول اللعب — انت المضيف، ولو قفلتها انقطعت الغرفة على الكل.</div>
   <div class="warn"><b>ملاحظة أمانة:</b> جهاز المضيف هو اللي يوزّع الورق، فتقنياً يقدر يشوف ورق الجميع — زي اللي يمسك الشدّة في الواقع.</div>`);
}
function lobbyGuest(){
  const d=NET.lobby;
  const spec=NET.role==="spec";
  ovShow(`<div class="hero sm"><h2>غرفة ${NET.code}</h2>
    <p>${spec?"انت متفرّج — بتشوف اللعب والعروض بدون ما تلعب.":"انتظر المضيف يبدأ اللعب."}</p></div>
   ${d?`<div class="lobby-list">${rosterRows(d.players,d.specs,false)}</div>`:""}
   <div class="conn" id="netConn">متصل</div>
   <div class="ctl" style="margin-top:14px"><button class="act b-quiet" onclick="leaveRoom()">اخرج من الغرفة</button></div>`);
}
function startOnline(){
  const ps=players_();
  ps.forEach((r,k)=>r.seat=k);                  // نرصّ المقاعد قبل البداية
  const bots=Math.min(NET.bots||0,13-ps.length);
  const botNames=BOTNAMES.slice(0,bots);
  const names=ps.map(r=>r.name).concat(botNames);
  NET.seat=ps.findIndex(r=>r.cid===CID);
  NET.botSeats=names.length-bots;               // البوتات تجي بعد البشر
  lobbyBeat(false);                             // بدأت — تطلع من قائمة الغرف المفتوحة
  ovHide();
  newSession(names.length,"online",NET.botDiff||"mid",names);
  S.players.forEach((p,k)=>p.bot = k>=NET.botSeats);   // البشر لا، البوتات نعم
  S.viewer=NET.seat;
  if(bots)say(`${bots} بوت دخلوا الطاولة (${{easy:"سهل",mid:"متوسط",hard:"صعب"}[NET.botDiff||"mid"]})`,"hi");
  saveRoom();
  broadcast(rosterMsg());
  pushState();render();
  advance();                                     // لو أول دور لبوت يتحرّك
}
/* نحفظ آخر غرفة عشان اللي يطلع يقدر يرجع لها بضغطة */
function saveRoom(){
  try{ localStorage.setItem("dagesh-room",JSON.stringify({code:NET.code,name:NET.me,t:Date.now()})); }catch(e){}
}
function lastRoom(){
  try{ const r=JSON.parse(localStorage.getItem("dagesh-room")||"null");
       return (r && Date.now()-r.t < 6*3600e3) ? r : null; }catch(e){ return null; }
}
function clearRoom(){ try{localStorage.removeItem("dagesh-room")}catch(e){} }

/* المضيف يطلع بس الجلسة تكمل — يقدر يرجع بعدين لنفس مقعده */
function hostStepOut(){
  saveRoom();
  lobbyBeat(false);
  broadcast({t:"hostleft"});
  trAnnounceHost(false);
  keepAwake(false);
  trClose();
  const room=lastRoom();
  NET=null; S=null; ovHide(); setup();
  setTimeout(()=>{ if(room)ovShow(`<div class="hero sm"><h2>طلعت من الغرفة</h2>
    <p>الجلسة تكمل بدونك، وواحد منهم استلم الاستضافة. تقدر ترجع لنفس مقعدك ورصيدك أي وقت.</p></div>
    <div class="ctl">
      <button class="act b-brass" onclick="ovHide();joinRoom('${esc(room.name)}','${room.code}')">ارجع للغرفة ${room.code}</button>
      <button class="act b-quiet" onclick="ovHide()">لا، خلاص</button></div>`);},250);
}

function leaveRoom(){
  browseClose();
  if(NET){
    if(isHost()){ lobbyBeat(false); broadcast({t:"closed"}); trAnnounceHost(false); }
    else trToHost({t:"bye"});
  }
  keepAwake(false);
  trClose();
  NET=null; S=null;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  ovHide(); setup();
}
function copyLink(btn,link){
  const done=()=>{const t=btn.textContent;btn.textContent="اننسخ ✓";setTimeout(()=>btn.textContent=t,1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(link).then(done,()=>prompt("انسخ الرابط:",link));
  else prompt("انسخ الرابط:",link);
}

$("gateBtn").addEventListener("click",()=>{S.gate=false;render();});
$("chatSend").addEventListener("click",chatSend);
$("chatIn").addEventListener("keydown",e=>{if(e.key==="Enter")chatSend();});
volIcon();
$("bMute").addEventListener("click",toggleMute);
$("bRules").addEventListener("click",rules);
$("bNew").addEventListener("click",()=>{
  if(!isOnline())return setup();
  ovShow(`<div class="hero sm"><h2>تبي تطلع؟</h2>
    <p>تقدر تطلع والجلسة تكمل بدونك، وترجع لنفس مقعدك ورصيدك متى ما بغيت.</p></div>
    <div class="ctl"><button class="act b-brass" onclick="ovHide()">لا، رجّعني للعب</button></div>
    <div class="ctl" style="margin-top:8px">
      <button class="act b-quiet" onclick="ovHide();hostStepOut()">اطلع والجلسة تكمل</button>
      ${isHost()?`<button class="act b-pom" onclick="leaveRoom()">أنهِ الجلسة للكل</button>`:""}
    </div>`);
});
setup();
</script>
</body>
</html>
